# service/pyproject.toml
[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "roadmodel-service"
version = "0.3.0"
description = "FastAPI wrapper service for roadmodel recommendations."
requires-python = ">=3.12"
dependencies = [
    "roadmodel[recommend]>=0.2.29,<0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.1",
    "mypy>=1.8",
]

[tool.vercel]
# Vercel Python runtime entrypoint. Resolves to service/app/main.py:app
# when the Vercel project's Root Directory is set to service/. See
# https://vercel.com/docs/functions/runtimes/python.
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = ["S404"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["roadmodel.*"]
ignore_missing_imports = true
