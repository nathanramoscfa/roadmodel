[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "roadmodel"
version = "0.2.28"
description = "BYO-key CLI that recommends the right AI model, platform, and settings for a prompt."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nathan Ramos", email = "nathan.ramos.github@gmail.com" }]
keywords = ["ai", "llm", "model-selection", "anthropic", "openai", "gemini", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.3.3",
]

[project.optional-dependencies]
# Provider SDKs — needed ONLY for `roadmodel recommend` (live API calls to a
# provider). The offline planning-kit workflow (export-kit, catalog, context,
# version) imports none of them, so they are an opt-in extra: `pip install
# roadmodel` stays lightweight and free of dependency conflicts with whatever
# project you drop it into; `pip install "roadmodel[recommend]"` adds the
# engine. See providers/*.py — each SDK is imported lazily at call time.
recommend = [
    "anthropic>=0.97.0",
    "openai>=2.33.0",
    "google-genai>=1.74.0",
]
dev = [
    "roadmodel[recommend]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
# The MCP server serves recommendations, so it needs the engine extra too.
mcp = ["mcp>=1.0", "roadmodel[recommend]"]

[project.scripts]
roadmodel = "roadmodel.cli:main"
roadmodel-mcp = "roadmodel.mcp_server:main"

[project.urls]
Homepage = "https://roadmodel.ai"
Repository = "https://github.com/nathanramoscfa/roadmodel"
Issues = "https://github.com/nathanramoscfa/roadmodel/issues"

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/roadmodel"]
include = [
    "src/roadmodel/data/*",
    "src/roadmodel/data/catalog.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/roadmodel/**",
    "docs/model-selector.txt",
    "docs/model-tier-cost-scale.md",
    "docs/settings-display.md",
    "docs/templates/phase-roadmap-template.md",
    "docs/templates/project-roadmap-template.md",
    "docs/templates/planning-kit-how-to-use.md",
    "docs/user-context.example.md",
    "docs/catalog.json",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep ruff defaults (E4/E7/E9 + F) and add I (import order), B (likely
# bugs), and S (flake8-bandit security rules).
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
# S404 (subprocess imports) is fine project-wide; each call site is
# audited and shells out only to controlled binaries.
ignore = ["S404"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, predictable /tmp paths via fixtures,
# and call out to git/python/etc via subprocess with literal args.
"tests/**" = ["S101", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["google.genai.*"]
ignore_missing_imports = true

# pyarrow ships no py.typed marker, so mypy --strict raises import-untyped
# wherever it is imported (update/update_models.py's LMArena parquet parse).
# The installed build varies: some wheels carry partial stubs, some none —
# so treat it as untyped everywhere for a deterministic strict check.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
