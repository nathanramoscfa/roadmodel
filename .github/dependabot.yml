version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories: [/, /service, /tests, /update, /.github]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python:
        update-types: [minor, patch]
