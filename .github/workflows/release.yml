# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish to PyPI (e.g. v0.1.1-pypi). Tag-push runs go as far as TestPyPI; this dispatch is the manual gate that publishes to PyPI and creates the GitHub Release."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  sign:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
          upload-signing-artifacts: false
      - name: Ensure signature files exist
        run: |
          set -euo pipefail
          ls -la dist
          count="$(find dist -maxdepth 1 -type f \( -name '*.sigstore' -o -name '*.sigstore.json' \) | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "No signature bundles were produced in dist/."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: |
            dist/*.sigstore
            dist/*.sigstore.json
          if-no-files-found: error

  testpypi-upload:
    runs-on: ubuntu-latest
    needs: sign
    # Tag push only — workflow_dispatch is the PyPI publish path.
    # *-phase-* tags are milestone markers and should not publish.
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-phase-') }}
    permissions:
      contents: read
      # OIDC trusted publishing: the action exchanges this GitHub
      # OIDC token for a short-lived TestPyPI API token. No long-lived
      # secret needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Pinned to v1.14.0 (commit 2026-04-07) instead of the mutable
      # release/v1 branch ref so a compromised publisher cannot silently
      # change the action under us.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  pypi-upload:
    runs-on: ubuntu-latest
    needs: sign
    # Manual gate: only the workflow_dispatch path publishes to PyPI.
    # *-phase-* dispatched tags are still rejected as a safety net.
    if: ${{ github.event_name == 'workflow_dispatch' && !contains(inputs.tag, '-phase-') }}
    # `pypi-production` environment is declared for defense-in-depth so
    # that when the repo's billing plan supports required-reviewer rules,
    # they automatically apply to this job without further code changes.
    # It also matches the environment name configured at PyPI's Trusted
    # Publisher settings, scoping the OIDC exchange to this gated job.
    environment: pypi-production
    permissions:
      contents: read
      # OIDC trusted publishing: the action exchanges this GitHub
      # OIDC token for a short-lived PyPI API token. No long-lived
      # secret needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/

  github-release:
    runs-on: ubuntu-latest
    needs: pypi-upload
    if: ${{ github.event_name == 'workflow_dispatch' && !contains(inputs.tag, '-phase-') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: signatures
          path: dist
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          base_version="${version%%-*}"
          awk -v v="$version" '
            BEGIN { in_section = 0 }
            $0 ~ "^## \\[" v "\\]" { in_section = 1 }
            in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" v "\\]" { exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            awk -v v="$base_version" '
              BEGIN { in_section = 0 }
              $0 ~ "^## \\[" v "\\]" { in_section = 1 }
              in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" v "\\]" { exit }
              in_section { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "## [${version}]"
              echo
              echo "Automated release for tag ${TAG_NAME}."
              echo "No matching changelog section was found."
            } > RELEASE_NOTES.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore
            dist/*.sigstore.json
