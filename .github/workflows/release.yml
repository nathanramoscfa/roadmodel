# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  sign:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
          upload-signing-artifacts: false
      - name: Ensure signature files exist
        run: |
          set -euo pipefail
          ls -la dist
          count="$(find dist -maxdepth 1 -type f \( -name '*.sigstore' -o -name '*.sigstore.json' \) | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "No signature bundles were produced in dist/."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: |
            dist/*.sigstore
            dist/*.sigstore.json
          if-no-files-found: error

  testpypi-upload:
    runs-on: ubuntu-latest
    needs: sign
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-phase-') }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          packages-dir: dist/

  pypi-upload:
    runs-on: ubuntu-latest
    needs: testpypi-upload
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-phase-') }}
    environment: pypi-production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/

  github-release:
    runs-on: ubuntu-latest
    needs: pypi-upload
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-phase-') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: signatures
          path: dist
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          base_version="${version%%-*}"
          awk -v v="$version" '
            BEGIN { in_section = 0 }
            $0 ~ "^## \\[" v "\\]" { in_section = 1 }
            in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" v "\\]" { exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            awk -v v="$base_version" '
              BEGIN { in_section = 0 }
              $0 ~ "^## \\[" v "\\]" { in_section = 1 }
              in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" v "\\]" { exit }
              in_section { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "## [${version}]"
              echo
              echo "Automated release for tag ${TAG_NAME}."
              echo "No matching changelog section was found."
            } > RELEASE_NOTES.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore
            dist/*.sigstore.json
