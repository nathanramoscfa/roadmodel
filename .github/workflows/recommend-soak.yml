# .github/workflows/recommend-soak.yml
#
# Phase 4.5 Stream C — scheduled recommender SOAK. Runs scripts/soak-recommend.ts
# (the deterministic bar-scorecard) against gated prod daily and on demand, then
# REPORTS: on a bar regression it creates/updates a single tracking issue with
# the scorecard. The quality bar is report-only — never auto-fixes, and the job
# stays GREEN when only the bar is missed (the open tracking issue is the signal).
#
# The recommender being DOWN is not report-only. When half or more of the soak's
# requests fail (scripts/soak-health.ts; the script exits 3), the run FAILS and
# an incident issue opens, gets a comment on every failing run, and closes
# itself on the first run that gets answers again. Every production request
# failed from 2026-09-21 to 2026-09-24 while this job stayed green: the tracking
# issue already fails daily on known residuals, so nobody read it as an alarm.
#
# GATED: skips cleanly until the 5 prod-soak secrets are seeded as Actions
# secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_ANON_KEY,
# SITE_PASSWORD, and optional ROADMODEL_LATENCY_BYPASS_TOKEN). Until then it logs
# a notice and no-ops. NOTE: SUPABASE_SERVICE_ROLE_KEY grants full DB access —
# seeding it into Actions is a deliberate exposure decision (see the PR).

name: Recommender soak

on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC (clear of the catalog crons at 16:00/17:00)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: recommend-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check prod-soak secrets present
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] \
             && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ -n "$SITE_PASSWORD" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Prod-soak secrets not seeded — skipping. Seed SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_ANON_KEY, SITE_PASSWORD (and optionally ROADMODEL_LATENCY_BYPASS_TOKEN) as Actions secrets to enable."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.have == 'true'
        with:
          # Node 22 (not web/.nvmrc's 20): @supabase/supabase-js's realtime
          # client needs native global WebSocket, which lands in Node 22.
          # The soak is a standalone script, so it need not match the web build.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        if: steps.check.outputs.have == 'true'
        run: npm ci --prefix web

      - name: Run soak (report-only)
        id: soak
        if: steps.check.outputs.have == 'true'
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          ROADMODEL_LATENCY_BYPASS_TOKEN: ${{ secrets.ROADMODEL_LATENCY_BYPASS_TOKEN }}
        run: |
          set +e
          # tsx is a pinned devDependency (web/package.json + lockfile), so
          # `npm ci` links .bin/tsx — run it directly instead of `npx --yes`,
          # which would fetch tsx from npm at runtime alongside a full-access
          # DB key in env (supply-chain risk, audit L1). NODE_PATH so the
          # ../scripts file resolves @supabase/* against web/node_modules.
          NODE_PATH="$(pwd)/node_modules" node_modules/.bin/tsx ../scripts/soak-recommend.ts 2>&1 | tee /tmp/soak.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "health=$(grep -m1 '^SERVICE_HEALTH:' /tmp/soak.log || true)" >> "$GITHUB_OUTPUT"

      - name: Track regression in a single issue
        if: steps.check.outputs.have == 'true' && steps.soak.outputs.exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let log = "";
            try { log = fs.readFileSync("/tmp/soak.log", "utf8"); } catch {}
            const idx = log.indexOf("=== SOAK SCORECARD");
            const scorecard = idx >= 0 ? log.slice(idx) : log.slice(-3000);
            const title = "Recommender soak: quality bar not met";
            const body = [
              `The daily recommender soak did not meet the Phase 4.5 quality BAR (run ${context.runId}).`,
              "",
              "```",
              scorecard.trim(),
              "```",
              "",
              "Report-only (no auto-fix). Tracks the iterate-to-the-bar residuals (#185 / #188 / #189 + determinism). This issue is updated in place each failing run; it auto-resolves when the soak passes (close it once the bar holds).",
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "dogfood", per_page: 100,
            });
            const found = open.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["dogfood"] });
            }

      - name: Alarm while the recommender is down
        # exit 3 = scripts/soak-health.ts found half or more requests failing.
        if: steps.check.outputs.have == 'true' && steps.soak.outputs.exit == '3'
        uses: actions/github-script@v7
        env:
          HEALTH: ${{ steps.soak.outputs.health }}
        with:
          script: |
            const title = "Recommender is down: production requests are failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const health = process.env.HEALTH || "SERVICE_HEALTH: DOWN";
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: "incident", color: "B60205",
                description: "Production is failing; opened and closed by automation",
              });
            } catch {}
            // REST list + exact title (never the search index, which lags).
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const found = open.data.find((i) => i.title === title && !i.pull_request);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number,
                body: `Still down: \`${health}\` ([run](${run})).`,
              });
              return;
            }
            const body = [
              `The recommender soak found production down: \`${health}\` ([run](${run})).`,
              "",
              "Every failing request is a recommendation nobody got. To diagnose:",
              "- `curl -s https://roadmodel-api.vercel.app/healthz`: the service's health and the roadmodel version it runs.",
              "- `vercel logs <production deployment of roadmodel-api> --scope roadmodel`: the runtime error (on 2026-09-24 it was an ImportError at startup; see #717).",
              "- The soak log in the run above: each request's status.",
              "",
              "This issue gets a comment on every failing soak and closes itself on the first soak that gets answers again.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["incident"],
            });

      - name: Close the alarm once the recommender answers again
        if: steps.check.outputs.have == 'true' && steps.soak.outputs.exit != '' && steps.soak.outputs.exit != '3'
        uses: actions/github-script@v7
        env:
          HEALTH: ${{ steps.soak.outputs.health }}
        with:
          script: |
            const title = "Recommender is down: production requests are failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const found = open.data.find((i) => i.title === title && !i.pull_request);
            if (!found) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number,
              body: `Recovered: \`${process.env.HEALTH || "SERVICE_HEALTH: UP"}\` ([run](${run})). Closing.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, state: "closed",
            });

      - name: Fail the run while the recommender is down
        if: steps.check.outputs.have == 'true' && steps.soak.outputs.exit == '3'
        env:
          HEALTH: ${{ steps.soak.outputs.health }}
        run: |
          echo "::error title=Recommender is down::${HEALTH}"
          exit 1
