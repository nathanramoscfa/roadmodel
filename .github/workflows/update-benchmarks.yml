# .github/workflows/update-benchmarks.yml
name: Update benchmark layer (Artificial Analysis)

# Refreshes docs/benchmarks.json — the structured, single-source numbers the
# /models page shows next to (and instead of mining from) the catalog's prose.
# One request to the Artificial Analysis Insights API, joined to catalog ids
# through the editorial map in update/aa-model-map.json. See
# update/fetch_aa_benchmarks.py.
#
# The output is numbers only (no free text), fully reproducible from the API,
# so unlike the catalog cron this one auto-merges: nothing here needs the
# audit-L4 prose review. A catalog model with no map entry is reported in the
# PR body (and as a workflow warning) rather than failing the run — the row
# shows dashes until someone maps it.

on:
  schedule:
    # Daily at 22:00 UTC — after the availability probe (21:00) and the four
    # docs crons (16:00–20:00), and an hour after the catalog PR would have
    # landed new ids for the map warning to catch.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + build + diff, but do NOT open a PR."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-benchmarks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          # App token so the PR triggers required-status workflows (the default
          # GITHUB_TOKEN's PRs do not). Same pattern as the other crons.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: update/requirements.txt

      - name: Install dependencies
        run: pip install -r update/requirements.txt

      - name: Refresh docs/benchmarks.json
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          set -euo pipefail
          python update/fetch_aa_benchmarks.py | tee /tmp/bench.out
          # Determinism: a second build from the same payload would hit the API
          # again; instead assert the file parses and carries rows.
          python - <<'EOF'
          import json
          d = json.load(open("docs/benchmarks.json"))
          assert d["model_count"] > 0, "benchmarks.json has no measured models"
          print(f"{d['model_count']} measured; unmapped={d['unmapped']}; missing={d['missing_slugs']}")
          EOF

      - name: Open auto-merging PR if the layer changed
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/benchmarks.json; then
            echo "No benchmark changes — nothing to commit."
            exit 0
          fi
          git config user.name "roadmodel-bot"
          git config user.email "roadmodel-bot@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/benchmarks-refresh-${DATE}"
          # Newest supersedes: an older unmerged refresh from this cron is
          # strictly staler than what we are about to open, so close it rather
          # than let a pile form (issue #523's failure mode).
          for old in $(gh pr list --state open --search "head:chore/benchmarks-refresh-" --json number,headRefName \
              -q '.[] | select(.headRefName | startswith("chore/benchmarks-refresh-")) | .number' || true); do
            gh pr close "$old" --delete-branch --comment "Superseded by the ${DATE} benchmark refresh." || true
          done
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          notes="$(python - <<'EOF'
          import json
          d = json.load(open("docs/benchmarks.json"))
          lines = [f"- {d['model_count']} catalog models carry Artificial Analysis measurements."]
          if d["unmapped"]:
              lines.append("- **Unmapped catalog ids** (add to `update/aa-model-map.json`, `--suggest` lists candidates): " + ", ".join(f"`{m}`" for m in d["unmapped"]))
          if d["missing_slugs"]:
              lines.append("- **Map points at slugs AA no longer serves**: " + ", ".join(f"`{m}`" for m in d["missing_slugs"]))
          print("\n".join(lines))
          EOF
          )"
          git add docs/benchmarks.json
          git commit -m "Automated benchmark refresh: ${DATE}" -m "${notes}"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated benchmark refresh: ${DATE}" \
            --body "$(printf '## Summary\n\n%s\n\n---\n\nOpened automatically by `.github/workflows/update-benchmarks.yml`: one fetch of the Artificial Analysis Insights API joined to catalog ids via `update/aa-model-map.json`. Numbers only, no prose, so auto-merge is enabled — GitHub squash-merges once checks pass. To stop it: `gh pr merge --disable-auto`.' "$notes")")"
          echo "Opened: $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL"
