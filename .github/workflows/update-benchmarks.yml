# .github/workflows/update-benchmarks.yml
name: Update benchmark layer (Artificial Analysis)

# Refreshes docs/benchmarks.json — the structured, single-source numbers the
# /models page shows next to (and instead of mining from) the catalog's prose.
# One request to the Artificial Analysis Insights API, joined to catalog ids
# through the editorial map in update/aa-model-map.json. See
# update/fetch_aa_benchmarks.py.
#
# The output is numbers only (no free text), fully reproducible from the API,
# so unlike the catalog cron this one auto-merges: nothing here needs the
# audit-L4 prose review. A catalog model with no map entry is reported in the
# PR body (and as a workflow warning) rather than failing the run — the row
# shows dashes until someone maps it.
#
# The four derived ratings (update/derive_ratings.py) are re-applied to the
# selector in the same run, so a benchmark move that crosses a band ships the
# letter change with the number that caused it — structured attributes only,
# with the change table in the PR body. The best-for / headline-benchmarks
# prose that update/model_prose.py writes is a deterministic function of those
# same numbers and letters (no model writes it), so it rides the same auto-merge.

on:
  schedule:
    # Daily at 22:00 UTC — after the availability probe (21:00) and the four
    # docs crons (16:00–20:00), and an hour after the catalog PR would have
    # landed new ids for the map warning to catch.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + build + diff, but do NOT open a PR."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-benchmarks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          # App token so the PR triggers required-status workflows (the default
          # GITHUB_TOKEN's PRs do not). Same pattern as the other crons.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: update/requirements.txt

      - name: Install dependencies
        run: pip install -r update/requirements.txt

      - name: Refresh docs/benchmarks.json
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          set -euo pipefail
          python update/fetch_aa_benchmarks.py | tee /tmp/bench.out
          # Determinism: a second build from the same payload would hit the API
          # again; instead assert the file parses and carries rows.
          python - <<'EOF'
          import json
          d = json.load(open("docs/benchmarks.json"))
          assert d["model_count"] > 0, "benchmarks.json has no measured models"
          print(f"{d['model_count']} measured; unmapped={d['unmapped']}; missing={d['missing_slugs']}; mismatched={d.get('mismatched', [])}")
          EOF

      - name: Re-derive ratings from the refreshed layer
        run: |
          set -euo pipefail
          python update/derive_ratings.py --write
          # The lifecycle rule (update/supersede.py): tag models a newer
          # same-maker model beats on every count, retire them 30 days on.
          python update/supersede.py --write | tee /tmp/supersede.out
          # Best-for + headline-benchmarks prose written from the data above
          # (update/model_prose.py); after the letters and tags, before render.
          python update/model_prose.py --write
          python update/render_md.py
          python update/build_catalog.py
          python update/derive_ratings.py --check

      - name: Flag efforts not yet token-measured
        # docs/effort-tokens.json prices each model's efforts by the tokens it
        # was measured drawing there (update/measure_effort_tokens.py). The
        # measurement runs on the operator's machine (it needs the Claude and
        # ChatGPT sign-ins), so a model or effort AA starts measuring reads the
        # uniform table until it does: keep ONE issue open listing them, and
        # close it when none is left.
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          missing="$(python update/measure_effort_tokens.py --unmeasured)"
          title="chore(effort-tokens): model efforts not yet token-measured"
          num="$(gh issue list --state open --limit 200 --json number,title \
            -q ".[] | select(.title == \"${title}\") | .number" | head -n1 || true)"
          if [ -z "${missing}" ]; then
            if [ -n "${num}" ]; then
              gh issue close "${num}" --comment "Every effort Artificial Analysis measures now has a token measurement."
            fi
            echo "Every AA-measured effort is token-measured."
            exit 0
          fi
          nl=$'\n'  # joins sections: $( ) strips the trailing newlines of what it captures
          list="$(printf '%s' "${missing}" | sed 's/^/- /')"
          body="Artificial Analysis measures these models at these efforts, and docs/effort-tokens.json has no token measurement for them, so the scorer prices them with the uniform table:${nl}${nl}${list}${nl}${nl}Measure them on the operator's machine (Claude Code and Codex signed in, OPENROUTER_API_KEY in the keychain), then open a PR with the file:${nl}${nl}    python update/measure_effort_tokens.py --models <ids>   # Codex 0.162+; --codex-bin to point at one${nl}${nl}This issue closes itself when the daily benchmark refresh finds nothing missing."
          if [ -n "${num}" ]; then
            gh issue edit "${num}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi

      - name: Open auto-merging PR if the layer changed
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          nl=$'\n'  # joins sections: $( ) strips the trailing newlines of what it captures
          if git diff --quiet -- docs/benchmarks.json docs/model-selector.txt docs/model-selector.md docs/catalog.json docs/effort-ratings.json update/aa-model-map.json; then
            echo "No benchmark or rating changes — nothing to commit."
            exit 0
          fi
          git config user.name "roadmodel-bot"
          git config user.email "roadmodel-bot@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/benchmarks-refresh-${DATE}"
          # Newest supersedes: an older unmerged refresh from this cron is
          # strictly staler than what we are about to open, so close it rather
          # than let a pile form (issue #523's failure mode).
          for old in $(gh pr list --state open --search "head:chore/benchmarks-refresh-" --json number,headRefName \
              -q '.[] | select(.headRefName | startswith("chore/benchmarks-refresh-")) | .number' || true); do
            gh pr close "$old" --delete-branch --comment "Superseded by the ${DATE} benchmark refresh." || true
          done
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          notes="$(python - <<'EOF'
          import json, os
          d = json.load(open("docs/benchmarks.json"))
          lines = [f"- {d['model_count']} catalog models carry Artificial Analysis measurements."]
          auto = []
          if os.path.exists("/tmp/bench.out"):
              auto = [ln.split(" ", 1)[1].strip() for ln in open("/tmp/bench.out") if ln.startswith("AUTO_MAPPED ")]
          if auto:
              lines.append("- **Auto-mapped new catalog ids** (exact AA slug match, written to `update/aa-model-map.json`): " + ", ".join(f"`{a}`" for a in auto))
          if d["unmapped"]:
              lines.append("- **Unmapped catalog ids** (add to `update/aa-model-map.json`, `--suggest` lists candidates): " + ", ".join(f"`{m}`" for m in d["unmapped"]))
          if d["missing_slugs"]:
              lines.append("- **Map points at slugs AA no longer serves**: " + ", ".join(f"`{m}`" for m in d["missing_slugs"]))
          if d.get("mismatched"):
              lines.append("- **Map joins an id to a differently named AA model** (scores left out, row shows dashes): " + ", ".join(f"`{m}`" for m in d["mismatched"]))
          print("\n".join(lines))
          EOF
          )"
          if grep -q '^| ' update/.last-ratings-report.md 2>/dev/null; then
            notes="${notes}${nl}${nl}$(cat update/.last-ratings-report.md)"
          fi
          if [ -s /tmp/supersede.out ]; then
            notes="${notes}${nl}${nl}### Catalog lifecycle (update/supersede.py)${nl}${nl}$(sed 's/^/- /' /tmp/supersede.out)"
          fi
          git add docs/benchmarks.json docs/model-selector.txt docs/model-selector.md docs/catalog.json docs/effort-ratings.json update/aa-model-map.json
          git commit -m "Automated benchmark refresh: ${DATE}" -m "${notes}"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated benchmark refresh: ${DATE}" \
            --body "$(printf '## Summary\n\n%s\n\n---\n\nOpened automatically by `.github/workflows/update-benchmarks.yml`: one fetch of the Artificial Analysis Insights API joined to catalog ids via `update/aa-model-map.json`. Numbers, derived rating letters, and the prose update/model_prose.py builds from them (no AI-written text), so auto-merge is enabled — GitHub squash-merges once checks pass. To stop it: `gh pr merge --disable-auto`.' "$notes")")"
          echo "Opened: $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL"
