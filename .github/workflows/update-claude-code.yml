# .github/workflows/update-claude-code.yml
name: Update Claude Code surface parameters

on:
  schedule:
    # Daily at 17:00 UTC. Staggered 1h after the Cursor catalog refresh
    # cron (16:00 UTC in update-models.yml) so the two crons never race
    # for the same branch / model-selector.txt write. The gate step hashes
    # BOTH Anthropic's claude-code CHANGELOG and the in-scope span of the
    # official model-config docs — the two canonical signals for a new
    # Claude Code surface parameter — and skips the Opus call on days
    # neither changed. See `update/check_claude_code_source.py`.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: gate + snapshot refresh + Opus --dry-run + conformance gate, but do NOT render, open a PR, or promote hashes."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-claude-code
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          # Authenticate as the roadmodel cron GitHub App (installation token
          # minted above) so the push + gh pr create are attributed to the App
          # and its PRs TRIGGER required-status workflows (the default
          # GITHUB_TOKEN's PRs do not). Replaces the old maintainer PAT
          # (secrets.BOT_PAT), which expired and broke the cron at checkout.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: update/requirements.txt

      - name: Install dependencies
        run: pip install -r update/requirements.txt

      - name: Restore Claude Code source-hash cache
        # CHANGELOG + in-scope-docs-span signatures and last-processed
        # version from the previous successful run. Restore-keys lookup
        # falls back to the most recent saved entry if the exact run_id
        # key misses (always, by design).
        uses: actions/cache@v4
        with:
          path: |
            update/.cache/claude-code-hash
            update/.cache/claude-code-docs-hash
            update/.cache/claude-code-last-version
          key: claude-code-hash-${{ github.run_id }}
          restore-keys: |
            claude-code-hash-

      - name: Check for upstream CHANGELOG / docs changes
        id: gate
        run: python update/check_claude_code_source.py

      - name: Snapshot selector for diff validator
        # Capture the pre-Opus contents of docs/model-selector.txt so the
        # validator's --before/--after path works after the post-Opus write.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        run: |
          mkdir -p update/.cache
          cp docs/model-selector.txt update/.cache/selector.before.txt

      - name: Refresh docs effort/thinking snapshot
        # Deterministically re-extract the official docs into the committed
        # snapshot BEFORE Opus, so Opus reconciles against fresh facts and
        # the conformance gate checks against them. Fatal on a docs
        # restructure (the extractor fails loud) — the maintainer investigates.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        run: python update/extract_claude_code_effort.py --output update/claude-code-effort.json

      - name: Flag new models for the catalog cron
        # A model in the docs effort table this tracker hasn't seen is the
        # catalog cron's lane. Open a DEDUPLICATED tracking issue (never edit
        # model lists here) so the flag survives the auto-merge — the PR body
        # also notes it. Deduped by title so a re-run doesn't spam.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t models < <(python -c "import json; [print(m) for m in json.load(open('update/claude-code-effort.json')).get('unexpected_models', [])]")
          if [ "${#models[@]}" -eq 0 ]; then
            echo "No new models flagged."
            exit 0
          fi
          gh label create cc-new-model --color FBCA04 \
            --description "Claude Code docs introduced a model the catalog cron should route" 2>/dev/null || true
          existing="$(gh issue list --state open --search 'Claude Code docs introduced model in:title' --json title -q '.[].title' || true)"
          for model in "${models[@]}"; do
            [ -z "$model" ] && continue
            if printf '%s\n' "$existing" | grep -Fq "$model"; then
              echo "Tracking issue already open for: ${model}"
              continue
            fi
            gh issue create \
              --title "chore(catalog): Claude Code docs introduced model \"${model}\"" \
              --label cc-new-model \
              --body "$(printf 'The Claude Code model-config docs effort table now lists **%s**, which the effort/thinking tracker has not seen before (recorded in `update/claude-code-effort.json` under `unexpected_models`).\n\nThis tracker only FLAGS new models — it never edits selector model lists; that is the catalog cron'"'"'s lane. **Action:** confirm whether **%s** should be added to `<model-options>` / `supports-models` via the catalog refresh.\n\nOpened automatically by the Claude Code refresh cron (`.github/workflows/update-claude-code.yml`).' "${model}" "${model}")"
            echo "Opened tracking issue for: ${model}"
          done

      - name: Refresh Claude Code surface parameters (Opus)
        # Skip on scheduled runs when neither source changed. workflow_dispatch
        # always runs. --docs-changed forces the reconciliation even with no
        # new CHANGELOG versions; --dry-run previews without writing.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        id: opus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          ARGS=""
          if [ "${{ steps.gate.outputs.docs_changed }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="$ARGS --docs-changed"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python update/update_claude_code.py $ARGS

      - name: Render model-selector.md
        # Keep the rendered mirror in sync with the .txt Opus just edited
        # (the test_doc_schema sync test gates this on the PR).
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: python update/render_md.py

      - name: Validate diff (coverage + citation)
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          if [ ! -f update/.cache/pending-bullets.json ]; then
            echo "No pending bullets — Opus step was a no-op; skipping validator."
            exit 0
          fi
          python update/validate_claude_code_diff.py \
            --consumed-versions update/.cache/consumed-versions.json \
            --before update/.cache/selector.before.txt \
            --after docs/model-selector.txt

      - name: Conformance gate (effort/thinking vs docs)
        # Deterministic backstop: the (Opus-edited) selector must conform to
        # the (freshly-extracted) docs snapshot — vocabulary subset, per-model
        # effort support, ultracode/ultrathink distinct. Fatal on violation,
        # so a bad Opus prose edit blocks the PR. Runs in dry-run too (the
        # snapshot is refreshed even there).
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        run: python update/validate_effort_conformance.py

      - name: Open PR if selector or snapshot changed
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/model-selector.txt docs/model-selector.md update/claude-code-effort.json; then
            echo "No selector / snapshot changes — nothing to commit."
            exit 0
          fi
          git config user.name "roadmodel-bot"
          git config user.email "roadmodel-bot@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/claude-code-refresh-${DATE}"
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          summary="$(cat update/.last-claude-code-summary.txt 2>/dev/null || echo 'Automated Claude Code surface refresh.')"
          warnings=""
          if [ -f update/.last-claude-code-warnings.txt ] && [ -s update/.last-claude-code-warnings.txt ]; then
            warnings="$(printf '\n\n## Warnings\n')$(sed 's/^/- /' update/.last-claude-code-warnings.txt)"
          fi
          # FLAG (never act on) a new model the docs effort table introduced.
          unexpected="$(python -c "import json; print(', '.join(json.load(open('update/claude-code-effort.json')).get('unexpected_models', [])))" 2>/dev/null || true)"
          newmodel=""
          if [ -n "$unexpected" ]; then
            newmodel="$(printf '\n\n## New model(s) detected — route to the catalog cron\n\nThe docs effort table introduced: %s. This tracker only FLAGS new models; do NOT add them to selector model lists here. Open an issue for the catalog refresh.' "$unexpected")"
          fi
          git add docs/model-selector.txt docs/model-selector.md update/claude-code-effort.json
          git commit -m "Automated Claude Code refresh: ${DATE}" -m "${summary}${warnings}${newmodel}"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated Claude Code refresh: ${DATE}" \
            --body "$(printf '## Summary\n\n%s%s%s\n\n---\n\nThis PR was opened automatically by the daily Claude Code refresh cron in `.github/workflows/update-claude-code.yml`. It tracks the CHANGELOG and the in-scope model-config docs span; the docs snapshot (`update/claude-code-effort.json`) and the offline conformance gate keep the selector consistent with the docs. Auto-merge is enabled: GitHub will squash-merge once the `test` status check passes. To stop it: `gh pr merge --disable-auto`.' "$summary" "$warnings" "$newmodel")")"
          echo "Opened: $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL"

      - name: Promote source-hash and last-version for next run
        # Only promote staged → canonical if every prior step succeeded and
        # this is not a dry run. A transient failure must NOT swallow a real
        # change: leave the old hashes in place so tomorrow's gate retries.
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          for name in claude-code-hash claude-code-docs-hash claude-code-last-version; do
            if [ -f "update/.cache/${name}.new" ]; then
              mv "update/.cache/${name}.new" "update/.cache/${name}"
              echo "Promoted ${name} for next-run comparison."
            fi
          done
