# .github/workflows/update-deepseek.yml
name: Update DeepSeek thinking parameters

on:
  schedule:
    # Daily at 20:00 UTC. Staggered 1h after the Gemini cron (19:00), 2h after
    # the Codex cron (18:00), 3h after the Claude Code cron (17:00), 4h after the
    # Cursor catalog cron (16:00) so the crons never race for the same branch /
    # model-selector.txt write. The gate fetches the DeepSeek thinking-mode docs
    # (HTML), validates the server-rendered table anchors are present, and hashes
    # the EXTRACTED FACTS — so it skips the Opus call unless the actual thinking
    # facts changed. See `update/check_deepseek_source.py`.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: gate + snapshot refresh + Opus --dry-run + conformance gate, but do NOT render, open a PR, or promote the hash."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-deepseek
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          # Authenticate as the roadmodel cron GitHub App (installation token
          # minted above) so the push + gh pr create are attributed to the App
          # and its PRs TRIGGER required-status workflows (the default
          # GITHUB_TOKEN's PRs do not). Replaces the old maintainer PAT
          # (secrets.BOT_PAT), which expired and broke the cron at checkout.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: update/requirements.txt

      - name: Install dependencies
        run: pip install -r update/requirements.txt

      - name: Restore DeepSeek source-hash cache
        # Extracted-facts signature from the previous successful run. Restore-keys
        # falls back to the most recent saved entry if the exact run_id key
        # misses (always, by design).
        uses: actions/cache@v4
        with:
          path: |
            update/.cache/deepseek-docs-hash
          key: deepseek-hash-${{ github.run_id }}
          restore-keys: |
            deepseek-hash-

      - name: Check for upstream docs changes
        id: gate
        run: python update/check_deepseek_source.py

      - name: Refresh thinking snapshot
        # Deterministically re-extract the official docs into the committed
        # snapshot BEFORE Opus, so Opus reconciles against fresh facts and the
        # conformance gate checks against them. Fatal on a docs restructure (the
        # bs4 extractor fails loud, exit 4) — this is the LOUD failure that a
        # dynamic-site break surfaces, rather than silently scraping a shell.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        run: python update/extract_deepseek_thinking.py --output update/deepseek-thinking.json

      - name: Flag new DeepSeek models for the catalog cron
        # A model in the DeepSeek pricing table this tracker hasn't seen is the
        # Cursor catalog cron's lane (the thinking-mode page lists no models, so
        # the lineup is read from the pricing page by extract_deepseek_models.py).
        # Open a DEDUPLICATED tracking issue (never edit model lists / add $ here)
        # so the flag survives auto-merge. Fail-open (the extractor never errors).
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t models < <(python update/extract_deepseek_models.py 2>/dev/null || true)
          if [ "${#models[@]}" -eq 0 ]; then
            echo "No new models flagged."
            exit 0
          fi
          gh label create deepseek-new-model --color FBCA04 \
            --description "DeepSeek docs introduced a model the catalog cron should route" 2>/dev/null || true
          # REST issues API + exact title, not --search (its search-index lag
          # returned empty in-run and re-filed dupes daily; see #420 for the
          # Claude Code fix + rationale).
          existing="$(gh issue list --state open --limit 200 --json title -q '.[].title' || true)"
          for model in "${models[@]}"; do
            [ -z "$model" ] && continue
            title="chore(catalog): DeepSeek docs introduced model \"${model}\""
            if printf '%s\n' "$existing" | grep -Fqx "$title"; then
              echo "Tracking issue already open for: ${model}"
              continue
            fi
            gh issue create \
              --title "$title" \
              --label deepseek-new-model \
              --body "$(printf 'The DeepSeek pricing docs introduced a model **%s**, which the DeepSeek thinking tracker has not seen before (baseline in `update/extract_deepseek_models.py`).\n\nThis tracker only FLAGS new models — it never edits selector model lists or adds per-token $ pricing; that is the catalog cron'"'"'s lane. **Action:** confirm whether **%s** should be added to `<model-options>` / `supports-models` via the catalog refresh.\n\nOpened automatically by the DeepSeek refresh cron (`.github/workflows/update-deepseek.yml`).' "${model}" "${model}")"
            echo "Opened tracking issue for: ${model}"
          done

      - name: Flag new DeepSeek reasoning-effort tiers
        # A docs-added NATIVE effort tier beyond high/max is significant (it needs
        # a deliberate THINKING-field mapping). The conformance gate already
        # hard-fails until the selector enumerates it, but open a deduped tracking
        # issue too so the new tier gets human eyes even if Opus maps it and the
        # PR auto-merges.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t tiers < <(python -c "import json; [print(x) for x in json.load(open('update/deepseek-thinking.json')).get('unexpected_effort', [])]")
          if [ "${#tiers[@]}" -eq 0 ]; then
            echo "No new reasoning-effort tiers flagged."
            exit 0
          fi
          gh label create deepseek-new-effort --color D93F0B \
            --description "DeepSeek docs introduced a reasoning-effort tier needing a THINKING mapping" 2>/dev/null || true
          # REST issues API + exact title, not --search (index lag re-filed
          # dupes daily; see #420).
          existing="$(gh issue list --state open --limit 200 --json title -q '.[].title' || true)"
          for tier in "${tiers[@]}"; do
            [ -z "$tier" ] && continue
            title="feat(selector): DeepSeek docs introduced reasoning-effort \"${tier}\""
            if printf '%s\n' "$existing" | grep -Fqx "$title"; then
              echo "Tracking issue already open for tier: ${tier}"
              continue
            fi
            gh issue create \
              --title "$title" \
              --label deepseek-new-effort \
              --body "$(printf 'The DeepSeek API thinking-mode docs introduced a reasoning-effort tier **%s** beyond the known baseline (high/max), recorded in `update/deepseek-thinking.json` under `unexpected_effort`.\n\nThe refresh cron has flowed it into `reasoning_effort`, so the conformance gate (check F) now requires the selector to enumerate and map it. **Action:** confirm the THINKING-field mapping the cron chose for **%s** (a new top-of-scale tier defaults to `XHigh`).\n\nOpened automatically by the DeepSeek refresh cron (`.github/workflows/update-deepseek.yml`).' "${tier}" "${tier}")"
            echo "Opened tracking issue for tier: ${tier}"
          done

      - name: Reconcile DeepSeek thinking surface (Opus)
        # Skip on scheduled runs when the extracted facts did not change.
        # workflow_dispatch always runs. --dry-run previews without writing.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        id: opus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          ARGS="--docs-changed"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python update/update_deepseek.py $ARGS

      - name: Render model-selector.md
        # Keep the rendered mirror in sync with the .txt Opus just edited (the
        # test_doc_schema sync test gates this on the PR).
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: python update/render_md.py

      - name: Conformance gate (thinking vocabulary vs docs)
        # Deterministic backstop: the (Opus-edited) selector must conform to the
        # (freshly-extracted) docs snapshot — DeepSeek check F plus the Claude
        # Code, Codex, and Gemini checks. Fatal on violation, so a bad Opus prose
        # edit blocks the PR. Runs in dry-run too (the snapshot is refreshed even
        # there).
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        run: python update/validate_effort_conformance.py

      - name: Open PR if selector or snapshot changed
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/model-selector.txt docs/model-selector.md update/deepseek-thinking.json; then
            echo "No selector / snapshot changes — nothing to commit."
            exit 0
          fi
          git config user.name "roadmodel-bot"
          git config user.email "roadmodel-bot@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/deepseek-refresh-${DATE}"
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          summary="$(cat update/.last-deepseek-summary.txt 2>/dev/null || echo 'Automated DeepSeek thinking refresh.')"
          warnings=""
          if [ -f update/.last-deepseek-warnings.txt ] && [ -s update/.last-deepseek-warnings.txt ]; then
            warnings="$(printf '\n\n## Warnings\n')$(sed 's/^/- /' update/.last-deepseek-warnings.txt)"
          fi
          # FLAG (never act on) a new DeepSeek model the pricing docs introduced.
          unexpected="$(python update/extract_deepseek_models.py 2>/dev/null | paste -sd, - | sed 's/,/, /g' || true)"
          newmodel=""
          if [ -n "$unexpected" ]; then
            newmodel="$(printf '\n\n## New model(s) detected — route to the catalog cron\n\nThe DeepSeek pricing docs introduced: %s. This tracker only FLAGS new models; do NOT add them to selector model lists or add $ pricing here. A tracking issue was opened.' "$unexpected")"
          fi
          # NOTE a new reasoning-effort tier the docs introduced (the selector was
          # updated to enumerate/map it; the conformance gate enforced it).
          unextiers="$(python -c "import json; print(', '.join(json.load(open('update/deepseek-thinking.json')).get('unexpected_effort', [])))" 2>/dev/null || true)"
          newtier=""
          if [ -n "$unextiers" ]; then
            newtier="$(printf '\n\n## New reasoning-effort tier(s) detected\n\nThe DeepSeek thinking docs introduced tier(s): %s. The selector was reconciled to enumerate and map them (new top-of-scale tier -> XHigh); the conformance gate enforced it. A tracking issue was opened for review.' "$unextiers")"
          fi
          git add docs/model-selector.txt docs/model-selector.md update/deepseek-thinking.json
          git commit -m "Automated DeepSeek refresh: ${DATE}" -m "${summary}${warnings}${newmodel}${newtier}"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated DeepSeek refresh: ${DATE}" \
            --body "$(printf '## Summary\n\n%s%s%s\n\n---\n\nThis PR was opened automatically by the daily DeepSeek refresh cron in `.github/workflows/update-deepseek.yml`. It tracks the DeepSeek API thinking-mode docs (HTML, parsed with bs4); the change trigger hashes the EXTRACTED FACTS, and the docs snapshot (`update/deepseek-thinking.json`) plus the offline conformance gate (check F) keep the selector consistent with the docs. Auto-merge is enabled: GitHub will squash-merge once the `test` status check passes. To stop it: `gh pr merge --disable-auto`.' "$summary" "$warnings$newmodel" "$newtier")")"
          echo "Opened: $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL"

      - name: Promote source-hash for next run
        # Only promote staged → canonical if every prior step succeeded and this
        # is not a dry run. A transient failure must NOT swallow a real change:
        # leave the old hash in place so tomorrow's gate retries.
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          if [ -f "update/.cache/deepseek-docs-hash.new" ]; then
            mv "update/.cache/deepseek-docs-hash.new" "update/.cache/deepseek-docs-hash"
            echo "Promoted deepseek-docs-hash for next-run comparison."
          fi
