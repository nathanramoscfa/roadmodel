# .github/workflows/phase-verify.yml
name: Phase verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        phase: ["01"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run phase verify script (--fast)
        run: bash "scripts/verify-phase${{ matrix.phase }}.sh" --fast

  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        phase: ["01"]
    steps:
      # fetch-depth: 0 so gitleaks detect can scan the full git history,
      # not just the latest commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.11-post-${{ hashFiles('pyproject.toml', 'tests/requirements.txt', 'update/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py3.11-post-
      - name: Install gitleaks
        # Pinned to v8.30.1 (2026-03-21) and SHA256-verified so a
        # compromised gitleaks release cannot silently change the binary
        # under us. Bump deliberately, not via a moving tag.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r update/requirements.txt
          pip install -r tests/requirements.txt
          pip install -e ".[dev]"
      - name: Run phase verify script (--post)
        # `gh pr checks` inside --post requires gh auth, which is not
        # configured here (we deliberately don't export GH_TOKEN), so the
        # script skips it. Live recommend smoke is also skipped because
        # ANTHROPIC_API_KEY is unset.
        run: bash "scripts/verify-phase${{ matrix.phase }}.sh" --post
