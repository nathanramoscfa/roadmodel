# .github/workflows/phase-verify.yml
name: Phase verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        phase: ["01", "02", "03", "04", "046"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ (matrix.phase == '03' || matrix.phase == '04' || matrix.phase == '046') && '3.12' || '3.11' }}
      - name: Run phase verify script (--fast)
        env:
          ROADMODEL_VERIFY_PYTHON: python
        run: bash "scripts/verify-phase${{ matrix.phase }}.sh" --fast

  post:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        phase: ["01", "02", "03", "04", "046"]
    steps:
      # fetch-depth: 0 so gitleaks detect can scan the full git history,
      # not just the latest commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ (matrix.phase == '03' || matrix.phase == '04' || matrix.phase == '046') && '3.12' || '3.11' }}
          # setup-python's built-in pip cache handles macOS
          # (~/Library/Caches/pip) and Linux (~/.cache/pip) paths
          # automatically — cleaner than a hand-rolled actions/cache.
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/requirements.txt
            update/requirements.txt
      - name: Install gitleaks
        # Pinned to v8.30.1 (2026-03-21) and SHA256-verified per
        # platform so a compromised gitleaks release cannot silently
        # change the binary under us. Bump deliberately, not via a
        # moving tag.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          case "${RUNNER_OS}" in
            Linux)
              GITLEAKS_PLATFORM="linux_x64"
              GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            macOS)
              case "$(uname -m)" in
                arm64)
                  GITLEAKS_PLATFORM="darwin_arm64"
                  GITLEAKS_SHA256="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
                  ;;
                x86_64)
                  GITLEAKS_PLATFORM="darwin_x64"
                  GITLEAKS_SHA256="dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"
                  ;;
                *)
                  echo "Unknown macOS arch: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${GITLEAKS_PLATFORM}.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r update/requirements.txt
          pip install -r tests/requirements.txt
          pip install -e ".[dev]"
      - name: Read Node version (Phase 3 post)
        if: matrix.phase == '03'
        id: node-version
        run: echo "version=$(cat web/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: matrix.phase == '03'
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies (Phase 3 post)
        if: matrix.phase == '03'
        run: npm ci --prefix web
      - name: Install Playwright Chromium (Phase 3 post)
        if: matrix.phase == '03'
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run phase verify script (--post)
        env:
          ROADMODEL_VERIFY_PYTHON: python
        # `gh pr checks` inside --post requires gh auth, which is not
        # configured here (we deliberately don't export GH_TOKEN), so the
        # script skips it. Live recommend smoke is also skipped because
        # ANTHROPIC_API_KEY is unset.
        run: bash "scripts/verify-phase${{ matrix.phase }}.sh" --post
