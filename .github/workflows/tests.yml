# .github/workflows/tests.yml
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy strict
        run: mypy --strict src

  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'tests/requirements.txt', 'update/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r update/requirements.txt
          pip install -r tests/requirements.txt
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -x --cov=roadmodel tests/

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Install wheel in a fresh venv
        run: |
          python -m venv .pkg-smoke-venv
          . .pkg-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          roadmodel --help

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.12-security-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py3.12-security-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bandit static analysis
        run: bandit -r src/
      - name: pip-audit (runtime + dev dependencies)
        # --skip-editable so roadmodel itself (installed editable for
        # CI) is not audited against PyPI; only third-party deps are.
        # --strict cannot combine with --skip-editable because the skip
        # is itself treated as a strict-mode error.
        run: pip-audit --skip-editable

  roadmap-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lint public ROADMAP.md against deny-list
        run: python update/sync_public_roadmap.py --check

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read Node version
        id: node-version
        run: echo "version=$(cat web/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Lint web
        run: npm --prefix web run lint
      - name: Typecheck web
        run: npm --prefix web run typecheck
      - name: Build web
        env:
          NEXT_PUBLIC_SITE_URL: https://staging.roadmodel.ai
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          UPSTASH_REDIS_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_TOKEN: ci-placeholder-redis-token
          ROADMODEL_IP_SALT: ci-placeholder-ip-salt
        run: npm --prefix web run build

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web-build]
    steps:
      - uses: actions/checkout@v5
      - name: Read Node version
        id: node-version
        run: echo "version=$(cat web/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build web
        env:
          NEXT_PUBLIC_SITE_URL: https://staging.roadmodel.ai
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          UPSTASH_REDIS_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_TOKEN: ci-placeholder-redis-token
          ROADMODEL_IP_SALT: ci-placeholder-ip-salt
        run: npm --prefix web run build
      - name: Run Playwright tests
        env:
          NEXT_PUBLIC_SITE_URL: https://staging.roadmodel.ai
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          UPSTASH_REDIS_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_TOKEN: ci-placeholder-redis-token
          ROADMODEL_IP_SALT: ci-placeholder-ip-salt
        run: npm --prefix web run test

  service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "service[dev]"
      - name: Ruff lint (service)
        run: ruff check service/
      - name: Mypy strict (service)
        run: mypy --strict service/
      - name: Pytest (service)
        run: pytest service/tests/ -x

  migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.12-migration-${{ hashFiles('tests/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py3.12-migration-
      - name: Start Postgres via docker compose
        run: |
          docker compose -f infra/test-postgres/docker-compose.yml up -d
      - name: Wait for Postgres health
        run: |
          for i in $(seq 1 30); do
            if docker compose -f infra/test-postgres/docker-compose.yml \
                 exec -T postgres pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in 60s" >&2
          docker compose -f infra/test-postgres/docker-compose.yml logs
          exit 1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -e ".[dev]"
      - name: Run Phase 4 migration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_phase04_migrations.py -v
      - name: Tear down Postgres
        if: always()
        run: |
          docker compose -f infra/test-postgres/docker-compose.yml down -v

  test:
    if: ${{ always() }}
    needs:
      - lint
      - type-check
      - test-matrix
      - package-smoke
      - security-scan
      - roadmap-sync
      - service-tests
      - web-build
      - web-test
      - migration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate test gate
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "type-check=${{ needs.type-check.result }}"
          echo "test-matrix=${{ needs.test-matrix.result }}"
          echo "package-smoke=${{ needs.package-smoke.result }}"
          echo "security-scan=${{ needs.security-scan.result }}"
          echo "roadmap-sync=${{ needs.roadmap-sync.result }}"
          echo "service-tests=${{ needs.service-tests.result }}"
          echo "web-build=${{ needs.web-build.result }}"
          echo "web-test=${{ needs.web-test.result }}"
          echo "migration-tests=${{ needs.migration-tests.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.test-matrix.result }}" != "success" ] || \
             [ "${{ needs.package-smoke.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.roadmap-sync.result }}" != "success" ] || \
             [ "${{ needs.service-tests.result }}" != "success" ] || \
             [ "${{ needs.web-build.result }}" != "success" ] || \
             [ "${{ needs.web-test.result }}" != "success" ] || \
             [ "${{ needs.migration-tests.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
