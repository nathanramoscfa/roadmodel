# .github/workflows/tests.yml
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests update
      - name: Ruff format check
        run: ruff format --check src tests update

  type-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'update/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # update/ scripts import requests / bs4 / pyarrow (self-typed) — needed
          # for `mypy --strict update` to resolve them.
          pip install -r update/requirements.txt
      - name: Mypy strict
        run: mypy --strict src update

  test-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml', 'tests/requirements.txt', 'update/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r update/requirements.txt
          pip install -r tests/requirements.txt
          pip install -e ".[dev]"
      - name: Pytest
        # Ignore the live-network source suite in the per-PR matrix (#170):
        # it makes real HTTP calls to external data sources (HuggingFace
        # LMArena parquet, etc.) that rate-limit (429), flaking CI and
        # blocking unrelated PRs. Live-source drift is covered by the weekly
        # cron (which carries AA_API_KEY); the verify scripts deselect it too.
        #
        # Deselect `freshness` for the same reason, one level up: it asserts
        # the refresh crons have committed recently, so a broken cron turns
        # EVERY pull request red — including the PR that repairs the cron.
        # That deadlock stalled the repo for three weeks (catalog cron broke
        # 2026-08-21; five cron PRs rotted behind the red check). The
        # assertion still runs daily at full strength in
        # .github/workflows/cron-health.yml, which files a tracking issue.
        run: pytest -x --cov=roadmodel tests/ --ignore=tests/test_sources_live.py -m "not freshness"

  agent-context-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify shared memory and Windows junctions
        run: python -m pytest -q tests/test_agent_context.py tests/test_updater_lock.py

  package-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
      - name: Build distribution
        run: |
          python -m pip install --require-hashes -r .github/requirements-build.txt
          python -m build --no-isolation
      - name: Install BARE wheel in a fresh venv (no recommend extra)
        run: |
          python -m venv .pkg-smoke-venv
          . .pkg-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          # The base install must stay lightweight: none of the provider SDKs
          # (the opt-in `recommend` extra) may be pulled in. This is the whole
          # point of 0.2.22 — `pip install roadmodel` must not conflict with a
          # host project's pinned openai/pydantic/etc.
          python -c "import importlib.util as u; leaked=[m for m in ('anthropic','openai','google') if u.find_spec(m)]; assert not leaked, f'provider SDK leaked into base install: {leaked}'; print('base install is SDK-free')"
          # Offline commands must work with zero SDKs installed.
          roadmodel --help
          roadmodel version
          roadmodel export-kit "$(mktemp -d)"
          # Every machine's scheduled updater hands its run to this module.
          python -m roadmodel.update_projects --self-check

  security-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked security tools and resolve audited dependencies separately
        run: |
          python -m venv "$RUNNER_TEMP/security-tools"
          "$RUNNER_TEMP/security-tools/bin/pip" install --require-hashes -r .github/requirements-security.txt
          python -m venv "$RUNNER_TEMP/audit-target"
          "$RUNNER_TEMP/audit-target/bin/pip" install -e ".[dev,recommend]" -e "service[dev]" -r update/requirements.txt
          "$RUNNER_TEMP/audit-target/bin/pip" freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
      - name: Bandit static analysis
        run: '"$RUNNER_TEMP/security-tools/bin/bandit" -r src/ update/ service/app/ -ll'
      - name: Audit resolved package, provider, service and CI dependencies
        run: '"$RUNNER_TEMP/security-tools/bin/pip-audit" --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"'

  roadmap-sync:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Lint public ROADMAP.md against deny-list
        run: python update/sync_public_roadmap.py --check

  web-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read Node version
        id: node-version
        run: echo "version=$(cat web/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high --prefix web
      - name: Lint web
        run: npm --prefix web run lint
      - name: Typecheck web
        run: npm --prefix web run typecheck
      - name: Build web
        run: npm --prefix web run build:ci

  web-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web-build]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read Node version
        id: node-version
        run: echo "version=$(cat web/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build web
        run: npm --prefix web run build:ci
      - name: Run Playwright tests
        run: npm --prefix web run test:ci

  service-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the in-repo roadmodel editable first so the
          # service's `roadmodel>=X.Y.Z` pin is satisfied without
          # waiting on a PyPI publish (relevant during PRs that bump
          # the roadmodel version + service pin in the same commit —
          # the new version doesn't exist on PyPI yet at CI time).
          # Install WITH the recommend extra: the service serves live
          # recommendations, so it needs the provider SDKs (0.2.22 made them
          # opt-in), mirroring the production `roadmodel[recommend]` pin.
          pip install -e ".[recommend]"
          pip install -e "service[dev]"
      - name: Ruff lint (service)
        run: ruff check service/
      - name: Mypy strict (service)
        run: mypy --strict service/
      - name: Pytest (service)
        run: pytest service/tests/ -x

  migration-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.12-migration-${{ hashFiles('tests/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py3.12-migration-
      - name: Start Postgres via docker compose
        run: |
          docker compose -f infra/test-postgres/docker-compose.yml up -d
      - name: Wait for Postgres health
        run: |
          for _attempt in $(seq 1 30); do
            if docker compose -f infra/test-postgres/docker-compose.yml \
                 exec -T postgres pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in 60s" >&2
          docker compose -f infra/test-postgres/docker-compose.yml logs
          exit 1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -e ".[dev]"
      - name: Run Phase 4 migration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_phase04_migrations.py -v
      - name: Tear down Postgres
        if: always()
        run: |
          docker compose -f infra/test-postgres/docker-compose.yml down -v

  workflow-security:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install integrity-pinned scanners
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/requirements-security.txt
          mkdir "$RUNNER_TEMP/scanners"
          cd "$RUNNER_TEMP/scanners"
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP/scanners" >> "$GITHUB_PATH"
      - name: Validate the locked refresh environment
        run: |
          python -m venv "$RUNNER_TEMP/updater-tools"
          "$RUNNER_TEMP/updater-tools/bin/pip" install --require-hashes --only-binary=:all: -r .github/requirements-updater.txt
          "$RUNNER_TEMP/updater-tools/bin/python" -c "import anthropic, bs4, pyarrow, requests"
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --no-online-audits --min-severity=medium .github/workflows
      - name: Scan all fetched history for secrets
        run: gitleaks git --redact=100 --no-banner --log-opts=--all .

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          output: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}
      - name: Enforce high and critical findings gate
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: python3 scripts/check_codeql_sarif.py "$SARIF_DIRECTORY"

  test:
    permissions: {}
    if: ${{ always() }}
    needs:
      - lint
      - type-check
      - agent-context-windows
      - test-matrix
      - package-smoke
      - security-scan
      - workflow-security
      - codeql
      - roadmap-sync
      - service-tests
      - web-build
      - web-test
      - migration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Enforce aggregate test gate
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "type-check=${{ needs.type-check.result }}"
          echo "agent-context-windows=${{ needs.agent-context-windows.result }}"
          echo "test-matrix=${{ needs.test-matrix.result }}"
          echo "package-smoke=${{ needs.package-smoke.result }}"
          echo "security-scan=${{ needs.security-scan.result }}"
          echo "roadmap-sync=${{ needs.roadmap-sync.result }}"
          echo "service-tests=${{ needs.service-tests.result }}"
          echo "web-build=${{ needs.web-build.result }}"
          echo "web-test=${{ needs.web-test.result }}"
          echo "migration-tests=${{ needs.migration-tests.result }}"
          if [ "${{ needs.workflow-security.result }}" != "success" ] || \
             [ "${{ needs.codeql.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.agent-context-windows.result }}" != "success" ] || \
             [ "${{ needs.test-matrix.result }}" != "success" ] || \
             [ "${{ needs.package-smoke.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.roadmap-sync.result }}" != "success" ] || \
             [ "${{ needs.service-tests.result }}" != "success" ] || \
             [ "${{ needs.web-build.result }}" != "success" ] || \
             [ "${{ needs.web-test.result }}" != "success" ] || \
             [ "${{ needs.migration-tests.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
