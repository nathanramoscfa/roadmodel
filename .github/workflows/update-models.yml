# .github/workflows/update-models.yml
name: Update roadmodel catalog docs

on:
  schedule:
    # Daily at 16:00 UTC. The first step hashes Cursor's pricing page —
    # the strongest signal for "new model released" — and skips the rest
    # of the pipeline (most importantly the ~$5 Opus call) on days the
    # page hasn't changed. See `update/check_sources.py` for the rationale
    # on why only pricing.md and not every benchmark source. Cron firing
    # daily keeps the latency between an upstream model release and the
    # catalog reflecting it under ~24h instead of ~7 days.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: gate + Opus --dry-run (prints the proposed catalog diff), but do NOT rebuild catalog.json, open a PR, or promote the source hash."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          # Authenticate as the roadmodel cron GitHub App (installation token
          # minted above) so the subsequent git push + gh pr create are
          # attributed to the App and its PRs TRIGGER required-status workflows
          # (the default GITHUB_TOKEN's PRs do not — a GitHub anti-recursion
          # feature — which left cron PRs BLOCKED with no `test` check firing).
          # Replaces the old maintainer PAT (secrets.BOT_PAT), which expired
          # and broke every cron at checkout; the App token auto-rotates.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: update/requirements.txt

      - name: Install dependencies
        run: pip install -r update/requirements.txt

      - name: Restore source-hash cache
        # The hash signature from the previous successful run lives in
        # GitHub Actions Cache. Restore looks for the exact key (always a
        # miss because we include run_id) then falls back to the prefix,
        # picking up whichever run last saved a signature. The save (post
        # step from this action) writes back under the unique run_id key.
        uses: actions/cache@v4
        with:
          path: update/.cache/sources-hash
          key: catalog-sources-hash-${{ github.run_id }}
          restore-keys: |
            catalog-sources-hash-

      - name: Check for upstream source changes
        id: gate
        run: python update/check_sources.py

      - name: Refresh roadmodel catalog (Opus)
        # Skip on scheduled runs when no upstream source changed. Manual
        # workflow_dispatch always runs — the operator triggered it for
        # a reason. A check_sources fetch error sets changed=true so the
        # gate fails open rather than silently skipping a real refresh.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          set -eo pipefail
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python update/update_models.py $ARGS

      - name: Refresh provider-direct catalog snapshots
        # Federation (Phase 4.6): refresh each provider's OWN pricing snapshot from
        # its own docs so the price-provenance gate (G4 in
        # update/validate_catalog_conformance.py) checks the selector against
        # CURRENT provider prices. Fail-open per provider — a fetch/parse failure
        # keeps the committed snapshot rather than breaking the catalog refresh
        # (a real source restructure surfaces later as a G4 mismatch / a stale
        # snapshot, not a hard cron failure here).
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          set -uo pipefail
          python update/extract_anthropic_catalog.py || echo "anthropic catalog refresh failed; keeping committed snapshot"
          python update/extract_openai_catalog.py || echo "openai catalog refresh failed; keeping committed snapshot"
          python update/extract_google_catalog.py || echo "google catalog refresh failed; keeping committed snapshot"
          python update/extract_xai_catalog.py || echo "xai catalog refresh failed; keeping committed snapshot"
          python update/extract_deepseek_catalog.py || echo "deepseek catalog refresh failed; keeping committed snapshot"
          # z.ai (Zhipu / GLM): real extractor parsing the Mintlify .md pricing source.
          python update/extract_zai_catalog.py || echo "zai catalog refresh failed; keeping committed snapshot"
          # Mistral has no machine-readable price source, so this is a DRIFT-CHECK
          # (model-name presence), not a price refresh; it never rewrites the
          # manually-maintained snapshot. Fail-open: a drift (exit 4) is logged.
          python update/extract_mistral_catalog.py || echo "mistral drift-check flagged or failed; catalog-mistral.json prices are manually maintained — review"
          # Groq-hosted gpt-oss: like Mistral, no machine-readable price table, so the
          # script re-writes the manual snapshot from its constant and DRIFT-CHECKS the
          # gpt-oss model names against groq.com/pricing (it does not parse prices).
          python update/extract_groq_catalog.py || echo "groq drift-check flagged or failed; catalog-groq.json prices are manually maintained — review"

      - name: Flag unfederated provider-direct models (model-list federation)
        # Phase 4.6 model-list federation (FLAG-ONLY): each provider-direct snapshot
        # is the discovery source for ITS models. Any snapshot model not yet in
        # <model-options> is flagged via a DEDUPED issue for an editorial add (with
        # tier ratings — the DeepSeek/Mistral path); it is NEVER auto-added, so no
        # unrated model can surface in recommendations. No-op when every snapshot
        # model is already in the registry (today's state). Fail-open.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          mapfile -t additions < <(python update/merge_catalog.py --check-additions 2>/dev/null || true)
          if [ ${#additions[@]} -eq 0 ]; then
            echo "No unfederated provider-direct models; nothing to flag."
            exit 0
          fi
          gh label create catalog-unfederated-model --color FBCA04 \
            --description "A provider-direct snapshot lists a model not yet in <model-options>" 2>/dev/null || true
          existing="$(gh issue list --state open --search 'provider-direct model in:title' --json title -q '.[].title' || true)"
          for model in "${additions[@]}"; do
            [ -z "${model}" ] && continue
            if grep -Fq "${model}" <<< "${existing}"; then
              echo "Issue already open for ${model}; skipping."
              continue
            fi
            gh issue create \
              --title "chore(catalog): provider-direct model \"${model}\" not in <model-options>" \
              --label catalog-unfederated-model \
              --body "A committed provider-direct catalog snapshot (\`update/catalog-*.json\`) lists \`${model}\`, which is not yet in \`<model-options>\` of \`docs/model-selector.txt\`. Add it editorially with tier ratings (the DeepSeek / Mistral path) so it becomes recommendable. Phase 4.6 model-list federation flags discovery only; it never auto-adds an unrated model." \
              || echo "issue create failed for ${model}"
          done

      - name: Re-apply provider-direct models (federation overlay)
        # Deterministic backstop (Phase 4.6 T4). The Opus refresh above rewrites
        # the catalog from Cursor's pricing page; this step reconciles every
        # provider-direct model against the committed snapshots so the conformance
        # gate stays green BY CONSTRUCTION and a provider price change auto-flows:
        #   1. whole-element providers the Opus rewrite drops (e.g. DeepSeek) are
        #      re-added from the committed (pre-run) selector;
        #   2. every provider-direct input/output price is forced to its snapshot
        #      in BOTH docs/model-selector.txt AND docs/model-tier-cost-scale.md
        #      (so G4 never rejects an Opus-authored price, and selector<->cost-scale
        #      stay consistent). Snapshots were refreshed in the prior step.
        # Strict no-op when the docs already match the snapshots. See
        # update/merge_catalog.py.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git show HEAD:docs/model-selector.txt > /tmp/base-selector.txt
          python update/merge_catalog.py --write --base /tmp/base-selector.txt
          python update/render_md.py

      - name: Rebuild docs/catalog.json (deterministic)
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          python update/build_catalog.py
          cp docs/catalog.json /tmp/catalog-run1.json
          python update/build_catalog.py
          if ! diff -q /tmp/catalog-run1.json docs/catalog.json >/dev/null; then
            echo "::error::build_catalog.py is not deterministic — outputs differ across consecutive runs."
            diff /tmp/catalog-run1.json docs/catalog.json || true
            exit 1
          fi

      - name: Open PR if catalog changed
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/ update/catalog-anthropic.json update/catalog-openai.json update/catalog-google.json update/catalog-xai.json update/catalog-deepseek.json update/catalog-zai.json update/catalog-mistral.json update/catalog-groq.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "roadmodel-bot"
          git config user.email "roadmodel-bot@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/catalog-refresh-${DATE}"
          # If a branch from a prior same-day run exists locally, drop it.
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          summary="$(cat update/.last-summary.txt 2>/dev/null || echo 'Automated catalog refresh.')"
          warnings=""
          if [ -f update/.last-warnings.txt ] && [ -s update/.last-warnings.txt ]; then
            warnings="$(printf '\n\n## Warnings\n')$(sed 's/^/- /' update/.last-warnings.txt)"
          fi
          git add docs/model-selector.txt docs/model-selector.md docs/model-tier-cost-scale.md docs/catalog.json update/catalog-anthropic.json update/catalog-openai.json update/catalog-google.json update/catalog-xai.json update/catalog-deepseek.json update/catalog-zai.json update/catalog-mistral.json update/catalog-groq.json
          git commit -m "Automated catalog refresh: ${DATE}" -m "${summary}${warnings}"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated catalog refresh: ${DATE}" \
            --body "$(printf '## Summary\n\n%s%s\n\n---\n\nThis PR was opened automatically by the daily catalog-refresh cron in `.github/workflows/update-models.yml`. **Human review required before merge (audit L4):** the catalog carries free-text prose fields (best-for, notes, pricing-notes) sourced from external provider pages that the deterministic gates (G4 price provenance, conformance A-F, schema tests) do NOT fully constrain — so a compromised/MITM-d page could inject prose that ships to the published selector + live recommender. Review the diff (especially prose changes), then squash-merge: `gh pr merge --squash --delete-branch <PR>`.' "$summary" "$warnings")")"
          echo "Opened (awaiting human review): $PR_URL"
          # Auto-merge intentionally NOT enabled (audit L4): the catalog's
          # free-text prose fields are not covered by the deterministic gates,
          # so a human reviews the diff before this reaches main + PyPI + the
          # live recommender. The structured price/schema fields ARE gate-locked
          # (G4 + conformance + tests), so review can focus on the prose.

      - name: Promote source-hash for next run
        # Only promote staged hash → canonical if every prior step
        # succeeded. A transient Opus failure must NOT swallow a real
        # upstream change: leave the old hash in place so tomorrow's
        # gate sees the same diff and retries. `success()` is true even
        # when the Opus/rebuild/PR steps were skipped via the `if:`
        # condition, so unchanged-source days promote correctly too.
        # Skip on a dry run so a preview never advances the hash (the real
        # next run must still see and process the upstream change).
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          if [ -f update/.cache/sources-hash.new ]; then
            mv update/.cache/sources-hash.new update/.cache/sources-hash
            echo "Promoted source-hash for next-run comparison."
          else
            echo "No staged hash to promote (check_sources.py did not run)."
          fi
