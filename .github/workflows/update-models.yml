# .github/workflows/update-models.yml
name: Update roadmodel catalog docs

on:
  schedule:
    # Hourly: each run reads every provider's own pricing page and hashes it
    # with Cursor's page, the docs trackers' model lists and the Codex model
    # list (update/check_sources.py). A change on any of them refreshes the
    # catalog within the hour; nothing changed, nothing runs past the gate.
    # The 16:00 run is the daily one: only it may start the curation pass
    # (~$5 of Opus tokens) for a change on Cursor's page.
    - cron: "0 16 * * *"
    - cron: "0 0-15,17-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: gate + Opus --dry-run (prints the proposed catalog diff), but do NOT rebuild catalog.json, open a PR, or promote the source hash."
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; zizmor: ignore[artipacked] credentials needed for scoped PR push
        with:
          persist-credentials: true
          # Authenticate as the roadmodel cron GitHub App (installation token
          # minted above) so the subsequent git push + gh pr create are
          # attributed to the App and its PRs TRIGGER required-status workflows
          # (the default GITHUB_TOKEN's PRs do not — a GitHub anti-recursion
          # feature — which left cron PRs BLOCKED with no `test` check firing).
          # Replaces the old maintainer PAT (secrets.BOT_PAT), which expired
          # and broke every cron at checkout; the App token auto-rotates.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-updater.txt

      - name: Install dependencies
        run: pip install --require-hashes -r .github/requirements-updater.txt

      - name: Restore source-hash cache
        # The hash signature from the previous successful run lives in
        # GitHub Actions Cache. Restore looks for the exact key (always a
        # miss because we include run_id) then falls back to the prefix,
        # picking up whichever run last saved a signature. The save (post
        # step from this action) writes back under the unique run_id key.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: update/.cache/sources-hash
          key: catalog-sources-hash-${{ github.run_id }}
          restore-keys: |
            catalog-sources-hash-

      - name: Refresh provider-direct catalog snapshots
        # Federation (Phase 4.6): refresh each provider's OWN pricing snapshot from
        # its own docs so the price-provenance gate (G4 in
        # update/validate_catalog_conformance.py) checks the selector against
        # CURRENT provider prices. Every run, before the source gate: a snapshot
        # that changed (a new model, a new price) is what starts a refresh
        # (update/check_sources.py). It runs before the curation pass, so the
        # pass's <provider_discovery> block (update/discovery.py) carries
        # today's flags and prices: any model update/dispose_discoveries.py
        # declines later in this run was shown to the pass first, priced.
        # Fail-open per provider — a fetch/parse failure keeps the committed
        # snapshot rather than breaking the catalog refresh — but never quiet:
        # each failed reader is recorded here and reported in an issue by the
        # last step of this run.
        id: readers
        run: |
          set -uo pipefail
          # A warning alone was not enough. update/extract_anthropic_catalog.py
          # stayed broken for weeks after Anthropic restyled a table header
          # (claude-sonnet-5 kept the aggregator mirror's $3/$15 while Anthropic
          # charged $2/$10), and the Google reader failed from 2026-11-10 when
          # the pricing page dropped its HTML tables: the run stayed green, and
          # Gemini 4 Carbon was never discovered. So each failure is also listed
          # for the "Report failing price readers" step.
          # z.ai (Zhipu / GLM) parses the Mintlify .md pricing source.
          : > "$RUNNER_TEMP/reader-failures.txt"
          for provider in anthropic openai google xai deepseek zai; do
            if ! python "update/extract_${provider}_catalog.py"; then
              echo "::error::${provider} price reader FAILED; keeping the committed (now stale) snapshot — its prices are no longer verified"
              echo "${provider}" >> "$RUNNER_TEMP/reader-failures.txt"
            fi
          done
          # Mistral has no machine-readable price source, so this is a DRIFT-CHECK
          # (model-name presence), not a price refresh; it never rewrites the
          # manually-maintained snapshot. Fail-open: a drift (exit 4) is logged.
          python update/extract_mistral_catalog.py || echo "mistral drift-check flagged or failed; catalog-mistral.json prices are manually maintained — review"
          # Groq-hosted gpt-oss: like Mistral, no machine-readable price table, so the
          # script re-writes the manual snapshot from its constant and DRIFT-CHECKS the
          # gpt-oss model names against groq.com/pricing (it does not parse prices).
          python update/extract_groq_catalog.py || echo "groq drift-check flagged or failed; catalog-groq.json prices are manually maintained — review"

      - name: Read the Codex model list
        # For the source gate; the overlay step syncs the same list into the
        # Codex methods. Fail-open: an empty list keeps the last signature.
        run: python update/extract_codex_models.py --recommended > "$RUNNER_TEMP/codex-ids.txt" || true

      - name: Check for upstream source changes
        # Each provider's own sources decide; Cursor's page is one of them and
        # the only one that starts the curation pass, on the daily run.
        id: gate
        env:
          CURSOR_DUE: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * *' }}
        run: python update/check_sources.py --cursor-due "${CURSOR_DUE}" --codex-ids "$RUNNER_TEMP/codex-ids.txt"

      - name: Flag near-miss supersessions that last three days
        # update/supersede.py prints `NEAR-MISS <old> -> <new>: missing on
        # <methods>` when a same-maker model passes every supersession test but
        # coverage, so the older model stays a candidate (Sonnet 5 stayed four
        # days that way, #853). The curation pass below checks each pair against
        # the method's own source (<near_miss_checks>). A pair that is a
        # near-miss on main today AND on main three days ago files ONE
        # title-deduped issue; update/close_resolved_issues.py (cron-health.yml)
        # closes it once the pair resolves. Runs every day, gate or not (no model
        # call) on the daily run, and never fails the refresh.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * *'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          git show HEAD:docs/model-selector.txt > /tmp/selector-now.txt
          python update/supersede.py --near-misses --selector /tmp/selector-now.txt || true
          git fetch --quiet --shallow-since="$(date -u -d '10 days ago' +%Y-%m-%d)" origin main || true
          old_rev="$(git rev-list -1 --before='3 days ago' FETCH_HEAD 2>/dev/null || true)"
          if [ -z "${old_rev}" ]; then
            echo "No main commit three or more days old in the fetched history; nothing to compare."
            exit 0
          fi
          git show "${old_rev}:docs/model-selector.txt" > /tmp/selector-3d.txt
          mapfile -t lasting < <(python update/supersede.py --near-misses \
            --selector /tmp/selector-now.txt --persisted-since /tmp/selector-3d.txt 2>/dev/null || true)
          if [ ${#lasting[@]} -eq 0 ]; then
            echo "No near-miss has lasted three days."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            printf 'Would flag (dry run): %s\n' "${lasting[@]}"
            exit 0
          fi
          gh label create catalog-near-miss --color FBCA04 \
            --description "A model would supersede an older one but for an access method that does not list it" 2>/dev/null || true
          # REST issues API + EXACT title (tests/test_cron_issue_dedup.py).
          existing="$(gh issue list --state open --limit 200 --json title -q '.[].title' || true)"
          for line in "${lasting[@]}"; do
            [ -z "${line}" ] && continue
            old="$(printf '%s' "${line}" | sed -E 's/^NEAR-MISS ([^ ]+) -> .*/\1/')"
            new="$(printf '%s' "${line}" | sed -E 's/^NEAR-MISS [^ ]+ -> ([^:]+):.*/\1/')"
            missing="$(printf '%s' "${line}" | sed -E 's/^.*: missing on //')"
            title="chore(catalog): near-miss supersession \"${old}\" -> \"${new}\""
            if printf '%s\n' "${existing}" | grep -Fqx "${title}"; then
              echo "Issue already open for ${old} -> ${new}; skipping."
              continue
            fi
            gh issue create \
              --title "${title}" \
              --label catalog-near-miss \
              --body "\`${new}\` passes every supersession test against \`${old}\` but coverage: ${missing} offer \`${old}\` and do not list \`${new}\`, so \`${old}\` stays a recommendation candidate. It has been so on main for at least three days. The daily catalog refresh checks each of those methods' own sources for \`${new}\` (\`<near_miss_checks>\` in update/update_models.py), and this issue closes itself once the pair resolves (update/close_resolved_issues.py, daily in cron-health.yml)." \
              || echo "issue create failed for ${old} -> ${new}"
          done

      - name: Refresh roadmodel catalog (Opus)
        # Runs when Cursor's page changed on the daily run. A change on a
        # provider's own page needs no model call: the deterministic steps
        # below add, price and retire models by rule. Manual workflow_dispatch
        # always runs — the operator triggered it for a reason. A Cursor fetch
        # error on the daily run counts as changed, so the pass surfaces it.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.cursor_changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -eo pipefail
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python update/update_models.py "${ARGS[@]}"

      - name: Keep the declined-models list (discovery lane)
        # The curation model regenerates docs/model-tier-cost-scale.md whole, so
        # restore any "## Declined Models (discovery lane)" line it dropped
        # before anything below reads the list (update/discovery.py).
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git show HEAD:docs/model-tier-cost-scale.md > /tmp/base-cost-scale.md
          python update/discovery.py --preserve-declined /tmp/base-cost-scale.md

      - name: Re-apply provider-direct models (federation overlay)
        # Deterministic backstop (Phase 4.6 T4). The Opus refresh above rewrites
        # the catalog from Cursor's pricing page; this step reconciles every
        # provider-direct model against the committed snapshots so the conformance
        # gate stays green BY CONSTRUCTION and a provider price change auto-flows:
        #   1. whole-element providers the Opus rewrite drops (e.g. DeepSeek) are
        #      re-added from the committed (pre-run) selector;
        #   2. every provider-direct input/output price is forced to its snapshot
        #      in BOTH docs/model-selector.txt AND docs/model-tier-cost-scale.md
        #      (so G4 never rejects an Opus-authored price, and selector<->cost-scale
        #      stay consistent). Snapshots were refreshed in the prior step.
        # Strict no-op when the docs already match the snapshots. See
        # update/merge_catalog.py.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git show HEAD:docs/model-selector.txt > /tmp/base-selector.txt
          # Prose guard: every line the curation pass added is checked for what
          # this prose never needs (URLs, active markup, hidden characters, text
          # addressed to a model). A hit quarantines the pass — both docs go back
          # to their committed text before the deterministic layers below run.
          python update/prose_guard.py --apply docs/model-selector.txt docs/model-tier-cost-scale.md
          python update/merge_catalog.py --write --base /tmp/base-selector.txt
          # Discovery lane: add or decline every flagged model the curation pass
          # left undecided — a priced same-series successor joins the catalog with
          # its predecessor's letters, anything else is declined with a reason
          # (update/dispose_discoveries.py). Before the Codex sync, so a new model
          # reaches the Codex methods this run; before model_prose.py, which writes
          # a new model's empty best-for and headline-benchmarks.
          python update/dispose_discoveries.py --write
          # Codex lists its models on its own page; a catalogued one belongs on both
          # Codex methods. Deterministic + additive — the prompt's supports-models
          # guard refuses a whole family launch at once. Fail-open on fetch errors.
          codex_ids="$(python update/extract_codex_models.py --recommended | paste -sd, - || true)"
          if [ -n "${codex_ids}" ]; then
            python update/merge_catalog.py --sync-method codex-cli --ids "${codex_ids}"
            python update/merge_catalog.py --sync-method codex-api --ids "${codex_ids}"
          fi
          # OpenRouter lists every model it routes on a public endpoint
          # (openrouter.ai/api/v1/models); a catalogued one belongs on the
          # openrouter method. Same pattern as the Codex sync: deterministic,
          # additive, fail-open on fetch errors (update/extract_openrouter_models.py).
          # The same fetch refreshes docs/context-windows.json, each model's
          # context window, which the scorer reads to keep a model out of a task
          # whose material it cannot hold.
          openrouter_ids="$(python update/extract_openrouter_models.py --context-windows docs/context-windows.json | paste -sd, - || true)"
          if [ -n "${openrouter_ids}" ]; then
            python update/merge_catalog.py --sync-method openrouter --ids "${openrouter_ids}"
          fi
          # Rating guard: every letter edit the curation pass made must follow
          # update/prompt.md's rules (declared with its category's evidence, one
          # step at a time, a new model from its computed placeholder). Edits
          # that break one are reverted; the report rides in the PR body.
          python update/rating_guard.py --apply --base /tmp/base-selector.txt --declarations update/.last-warnings.txt
          # Derived ratings overlay: tier-coding/agentic/long-context/knowledge
          # are a function of docs/benchmarks.json (update/derive_ratings.py),
          # so any Opus edit to them is reverted here and the coding S-tier
          # enumeration is regenerated. The report rides in the PR body.
          python update/derive_ratings.py --write
          # Lifecycle tags: re-apply the supersession rule, restoring any tag
          # (and its date) the curation pass dropped from the committed file.
          python update/supersede.py --write --base /tmp/base-selector.txt
          # The day each new model joined: /models counts its New tag from it
          # until Artificial Analysis dates the release (update/stamp_added.py).
          python update/stamp_added.py --write --base /tmp/base-selector.txt
          # Best-for + headline-benchmarks prose written from the data above
          # (update/model_prose.py); after the letters and tags, before render.
          python update/model_prose.py --write
          python update/render_md.py

      - name: Flag unfederated provider-direct models (model-list federation)
        # Runs after the overlay, so it sees what update/dispose_discoveries.py
        # left: every discovery-lane model is added or declined there, so the
        # discovery flags below are normally empty. A provider-direct snapshot
        # model missing from <model-options> (the DeepSeek/Mistral path) is still
        # flagged via a DEDUPED issue. Fail-open.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          mapfile -t additions < <(python update/merge_catalog.py --check-additions 2>/dev/null || true)
          mapfile -t undisposed < <(python update/discovery.py --check 2>/dev/null || true)
          if [ ${#additions[@]} -eq 0 ] && [ ${#undisposed[@]} -eq 0 ]; then
            echo "No unfederated provider-direct models and no undisposed discoveries; nothing to flag."
            exit 0
          fi
          gh label create catalog-unfederated-model --color FBCA04 \
            --description "A provider-direct snapshot lists a model not yet in <model-options>" 2>/dev/null || true
          # REST issues API + EXACT title, not --search: the search index lags
          # behind issue creation, so `--search '... in:title'` returned empty
          # in-run and re-filed the same issue on every run — four copies of
          # "deepseek-v4-flash-vision-exp" (#542, #543, #544, #545) between
          # 2026-08-24 and 2026-09-02. The other four crons were fixed in #420;
          # this one was missed.
          existing="$(gh issue list --state open --limit 200 --json title -q '.[].title' || true)"
          for model in "${additions[@]}"; do
            [ -z "${model}" ] && continue
            title="chore(catalog): provider-direct model \"${model}\" not in <model-options>"
            if printf '%s\n' "${existing}" | grep -Fqx "${title}"; then
              echo "Issue already open for ${model}; skipping."
              continue
            fi
            gh issue create \
              --title "${title}" \
              --label catalog-unfederated-model \
              --body "A committed provider-direct catalog snapshot (\`update/catalog-*.json\`) lists \`${model}\`, which is not yet in \`<model-options>\` of \`docs/model-selector.txt\`. Add it editorially with tier ratings (the DeepSeek / Mistral path) so it becomes recommendable. Phase 4.6 model-list federation flags discovery only; it never auto-adds an unrated model." \
              || echo "issue create failed for ${model}"
          done
          # The discovery lane: a model a provider's own page prices that this
          # run's curation neither added nor declined gets a deduped issue, so
          # an ignored flag is visible instead of silent (update/discovery.py).
          for model in "${undisposed[@]}"; do
            [ -z "${model}" ] && continue
            title="chore(catalog): provider page prices \"${model}\"; the catalog neither added nor declined it"
            if printf '%s\n' "${existing}" | grep -Fqx "${title}"; then
              echo "Issue already open for ${model}; skipping."
              continue
            fi
            gh issue create \
              --title "${title}" \
              --label catalog-unfederated-model \
              --body "The provider's own pricing page prices \`${model}\` (listed in \`unexpected_slugs\` of its \`update/catalog-*.json\` snapshot), and this run's curation neither added it to \`<model-options>\` nor declined it in the \`## Declined Models (discovery lane)\` section of \`docs/model-tier-cost-scale.md\`. Add it with tier ratings, or decline it with a reason." \
              || echo "issue create failed for ${model}"
          done

      - name: Rebuild docs/catalog.json (deterministic)
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          python update/build_catalog.py
          cp docs/catalog.json /tmp/catalog-run1.json
          python update/build_catalog.py
          if ! diff -q /tmp/catalog-run1.json docs/catalog.json >/dev/null; then
            echo "::error::build_catalog.py is not deterministic — outputs differ across consecutive runs."
            diff /tmp/catalog-run1.json docs/catalog.json || true
            exit 1
          fi

      - name: Catalog conformance + price-coverage report
        # G1-G4 are fatal here (schema, positive prices, tier mapping, composition,
        # and price provenance against each provider's own page).
        #
        # G5 is the advisory half: models whose maker publishes a provider-direct
        # snapshot but which are ABSENT from it, so their price came from the
        # aggregator mirror alone and G4 had nothing to reconcile — it passed for
        # lack of a comparison, not because the price agreed. Claude Opus 5
        # shipped that way. Those notes are folded into the PR body's Warnings
        # section so the un-cross-checked prices get human eyes at review time
        # instead of being indistinguishable from verified ones.
        #
        # Deliberately NOT fatal: providers ship models before pricing them
        # publicly, and blocking the refresh on an upstream publishing lag would
        # strand the lane the way the prose-anchor gate stranded Codex (#517).
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          python update/validate_catalog_conformance.py | tee /tmp/catalog-gate.out
          if grep -qE '^[[:space:]]*- G5 ' /tmp/catalog-gate.out; then
            sed -n 's/^[[:space:]]*-[[:space:]]*\(G5 .*\)$/\1/p' /tmp/catalog-gate.out \
              >> update/.last-warnings.txt
          fi

      - name: Open PR if catalog changed
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REFRESH_PATHS: docs/model-selector.txt docs/model-selector.md docs/model-tier-cost-scale.md docs/catalog.json docs/context-windows.json docs/effort-ratings.json update/catalog-anthropic.json update/catalog-openai.json update/catalog-google.json update/catalog-xai.json update/catalog-deepseek.json update/catalog-zai.json update/catalog-mistral.json update/catalog-groq.json
        run: |
          set -euo pipefail
          nl=$'\n'  # joins sections: $( ) strips the trailing newlines of what it captures
          # Keep what the typed boundary admits and hold the rest (new models,
          # access-list entries, decline lines, provider snapshots) for the
          # review PR below. Until 2026-10 one decline line refused the whole
          # run, prices and letters included (update/split_identity.py, #1120).
          base="$RUNNER_TEMP/refresh-base"
          rm -rf "$base" "$RUNNER_TEMP/refresh-hold"
          mkdir -p "$base" "$RUNNER_TEMP/refresh-hold"
          git archive HEAD docs update infra | tar -x -C "$base"
          # shellcheck disable=SC2086  # one path per word
          python update/split_identity.py --base-dir "$base" --hold "$RUNNER_TEMP/refresh-hold" --paths $REFRESH_PATHS
          python update/render_md.py
          # Validate final generated data before publishing or promoting source hashes.
          python update/automation_integrity.py
          if git diff --quiet -- docs/ update/catalog-anthropic.json update/catalog-openai.json update/catalog-google.json update/catalog-xai.json update/catalog-deepseek.json update/catalog-zai.json update/catalog-mistral.json update/catalog-groq.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "roadmodel-bot"
          git config user.email "roadmodel-bot@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/catalog-refresh-${DATE}"
          # If a branch from a prior same-day run exists locally, drop it.
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          summary="$(cat update/.last-summary.txt 2>/dev/null || echo 'Automated catalog refresh.')"
          warnings=""
          if [ -f update/.last-warnings.txt ] && [ -s update/.last-warnings.txt ]; then
            warnings="${nl}${nl}## Warnings${nl}$(sed 's/^/- /' update/.last-warnings.txt)"
          fi
          if [ -f update/.last-ratings-report.md ] && grep -q '^| ' update/.last-ratings-report.md; then
            warnings="${warnings}${nl}${nl}$(cat update/.last-ratings-report.md)"
          fi
          if [ -s update/.last-rating-guard.md ]; then
            warnings="${warnings}${nl}${nl}$(cat update/.last-rating-guard.md)"
          fi
          if [ -s update/.last-prose-guard.md ]; then
            warnings="${warnings}${nl}${nl}$(cat update/.last-prose-guard.md)"
          fi
          if [ -s update/.last-dispositions.md ]; then
            warnings="${warnings}${nl}${nl}$(cat update/.last-dispositions.md)"
          fi
          if [ -s update/.last-held.md ]; then
            warnings="${warnings}${nl}${nl}$(cat update/.last-held.md)${nl}${nl}They wait in the draft PR from \`chore/catalog-review\`."
          fi
          git add docs/model-selector.txt docs/model-selector.md docs/model-tier-cost-scale.md docs/catalog.json docs/context-windows.json docs/effort-ratings.json update/catalog-anthropic.json update/catalog-openai.json update/catalog-google.json update/catalog-xai.json update/catalog-deepseek.json update/catalog-zai.json update/catalog-mistral.json update/catalog-groq.json
          git commit -m "Automated catalog refresh: ${DATE}" -m "${summary}${warnings}"
          # Literal Markdown/jq syntax; shell expansion is not intended.
          # shellcheck disable=SC2016
          body="$(printf '## Summary\n\n%s%s\n\n---\n\nThis PR was opened automatically by the daily catalog-refresh cron in `.github/workflows/update-models.yml` and merges itself when CI is green. The review runs in code before it opens: the prose guard quarantines added text carrying URLs, markup, invisible characters or model-addressed instructions; the rating guard reverts letter edits that break the rating rules; G1-G4 lock schema, prices and their provenance; the generated prose fields are rewritten from data daily.' "$summary" "$warnings")"
          # A same-day re-run (a dispatch after the scheduled run) finds the day's
          # branch already on origin: its fresher refresh replaces that one, and
          # the open PR for the branch takes the new body. A plain push would be
          # refused as non-fast-forward and the re-run would open nothing.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git push --force -u origin "$BRANCH"
          else
            git push -u origin "$BRANCH"
          fi
          PR_URL="$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url' || true)"
          if [ -n "${PR_URL}" ]; then
            gh pr edit "${PR_URL}" --body "${body}"
            echo "Refreshed: $PR_URL"
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Automated catalog refresh: ${DATE}" \
              --body "${body}")"
            echo "Opened: $PR_URL"
          fi
          # A trusted default-branch workflow validates the final immutable
          # candidate and all checks before merging the exact head commit.
          echo "The validated refresh merger will evaluate $PR_URL."

      - name: Hold the rest for review (draft PR)
        # A new model, an access-list entry, a decline line or a provider
        # snapshot cannot merge itself: it waits in one rolling draft PR,
        # rebuilt from each run, for a maintainer to admit.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REFRESH_PATHS: docs/model-selector.txt docs/model-selector.md docs/model-tier-cost-scale.md docs/catalog.json docs/context-windows.json docs/effort-ratings.json update/catalog-anthropic.json update/catalog-openai.json update/catalog-google.json update/catalog-xai.json update/catalog-deepseek.json update/catalog-zai.json update/catalog-mistral.json update/catalog-groq.json
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # one path per word
          scripts/open-review-pr.sh chore/catalog-review "Catalog changes waiting for review" "$RUNNER_TEMP/refresh-hold" $REFRESH_PATHS

      - name: Promote source-hash for next run
        # Only promote staged hash → canonical if every prior step
        # succeeded. A transient Opus failure must NOT swallow a real
        # upstream change: leave the old hash in place so tomorrow's
        # gate sees the same diff and retries. `success()` is true even
        # when the Opus/rebuild/PR steps were skipped via the `if:`
        # condition, so unchanged-source days promote correctly too.
        # Skip on a dry run so a preview never advances the hash (the real
        # next run must still see and process the upstream change).
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          if [ -f update/.cache/sources-hash.new ]; then
            mv update/.cache/sources-hash.new update/.cache/sources-hash
            echo "Promoted source-hash for next-run comparison."
          else
            echo "No staged hash to promote (check_sources.py did not run)."
          fi

      - name: Report failing price readers
        # One issue per broken reader, filed the first run it fails and closed
        # the first run it reads again. The run that files a new issue fails, so
        # the break shows in cron health too; later runs stay green while the
        # issue is open. Last on purpose: the source-hash promotion above must
        # not wait on it.
        if: always() && steps.readers.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          failures="$RUNNER_TEMP/reader-failures.txt"
          [ -f "${failures}" ] || exit 0
          gh label create catalog-reader-failure --color D93F0B \
            --description "A provider's price reader failed; its prices are no longer verified" 2>/dev/null || true
          # REST issues API + EXACT title (tests/test_cron_issue_dedup.py).
          open_issues="$(gh issue list --state open --limit 200 --json number,title || echo '[]')"
          filed=false
          for provider in anthropic openai google xai deepseek zai; do
            title="chore(catalog): the ${provider} price reader is failing"
            number="$(printf '%s' "${open_issues}" | jq -r --arg t "${title}" '.[] | select(.title == $t) | .number' | head -1)"
            if grep -Fqx "${provider}" "${failures}"; then
              if [ -n "${number}" ]; then
                echo "Issue #${number} already open for the ${provider} reader."
                continue
              fi
              if gh issue create \
                --title "${title}" \
                --label catalog-reader-failure \
                --body "\`update/extract_${provider}_catalog.py\` failed in [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). The refresh keeps the committed \`update/catalog-${provider}.json\`, so ${provider}'s prices are no longer verified and a model it launches is not discovered. The usual cause is a restyled pricing page. This issue closes itself on the first run the reader works again."; then
                filed=true
              else
                echo "issue create failed for the ${provider} reader"
              fi
            elif [ -n "${number}" ]; then
              gh issue close "${number}" --comment "The ${provider} price reader works again ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))." \
                || echo "could not close #${number}"
            fi
          done
          if [ "${filed}" = true ]; then
            echo "::error::a price reader started failing; see the catalog-reader-failure issue"
            exit 1
          fi
