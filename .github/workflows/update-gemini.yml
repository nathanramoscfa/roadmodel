# .github/workflows/update-gemini.yml
name: Update Gemini thinking parameters

on:
  schedule:
    # Daily at 19:00 UTC. Staggered 1h after the Codex cron (18:00), 2h after
    # the Claude Code cron (17:00), 3h after the Cursor catalog cron (16:00) so
    # the crons never race for the same branch / model-selector.txt write. The
    # gate fetches the Gemini thinking docs (HTML), validates the server-rendered
    # table anchors are present, and hashes the EXTRACTED FACTS — so it skips the
    # Opus call unless the actual thinking facts changed. See
    # `update/check_gemini_source.py`.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: gate + snapshot refresh + Opus --dry-run + conformance gate, but do NOT render, open a PR, or promote the hash."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-gemini
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Maintainer PAT so the push + gh pr create are attributed to a user,
          # not the github-actions bot (PRs by GITHUB_TOKEN don't trigger
          # required-status workflows). Same pattern as the other crons.
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: update/requirements.txt

      - name: Install dependencies
        run: pip install -r update/requirements.txt

      - name: Restore Gemini source-hash cache
        # Extracted-facts signature from the previous successful run. Restore-keys
        # falls back to the most recent saved entry if the exact run_id key
        # misses (always, by design).
        uses: actions/cache@v4
        with:
          path: |
            update/.cache/gemini-docs-hash
          key: gemini-hash-${{ github.run_id }}
          restore-keys: |
            gemini-hash-

      - name: Check for upstream docs changes
        id: gate
        run: python update/check_gemini_source.py

      - name: Refresh thinking snapshot
        # Deterministically re-extract the official docs into the committed
        # snapshot BEFORE Opus, so Opus reconciles against fresh facts and the
        # conformance gate checks against them. Fatal on a docs restructure (the
        # bs4 extractor fails loud, exit 4) — this is the LOUD failure that a
        # dynamic-site break surfaces, rather than silently scraping a shell.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        run: python update/extract_gemini_thinking.py --output update/gemini-thinking.json

      - name: Flag new Gemini models for the catalog cron
        # A Gemini 3.x level-matrix model this tracker hasn't seen is the Cursor
        # catalog cron's lane. Open a DEDUPLICATED tracking issue (never edit
        # model lists here) so the flag survives auto-merge. Read from the
        # freshly-written snapshot's unexpected_models (this page is itself the
        # reasoning-matrix model source). Deduped by title.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail
          mapfile -t models < <(python -c "import json; [print(m) for m in json.load(open('update/gemini-thinking.json')).get('unexpected_models', [])]")
          if [ "${#models[@]}" -eq 0 ]; then
            echo "No new models flagged."
            exit 0
          fi
          gh label create gemini-new-model --color FBCA04 \
            --description "Gemini docs introduced a model the catalog cron should route" 2>/dev/null || true
          existing="$(gh issue list --state open --search 'Gemini docs introduced model in:title' --json title -q '.[].title' || true)"
          for model in "${models[@]}"; do
            [ -z "$model" ] && continue
            if printf '%s\n' "$existing" | grep -Fq "$model"; then
              echo "Tracking issue already open for: ${model}"
              continue
            fi
            gh issue create \
              --title "chore(catalog): Gemini docs introduced model \"${model}\"" \
              --label gemini-new-model \
              --body "$(printf 'The Gemini API thinking docs introduced a thinking-level model **%s**, which the Gemini thinking tracker has not seen before (recorded in `update/gemini-thinking.json` under `unexpected_models`).\n\nThis tracker only FLAGS new models — it never edits selector model lists; that is the catalog cron'"'"'s lane. **Action:** confirm whether **%s** should be added to `<model-options>` / `supports-models` via the catalog refresh.\n\nOpened automatically by the Gemini refresh cron (`.github/workflows/update-gemini.yml`).' "${model}" "${model}")"
            echo "Opened tracking issue for: ${model}"
          done

      - name: Flag new Gemini thinking levels
        # A docs-added thinking TIER beyond minimal/low/medium/high is significant
        # (it needs a deliberate THINKING-field mapping). The conformance gate
        # already hard-fails until the selector enumerates it, but open a deduped
        # tracking issue too so the new tier gets human eyes even if Opus maps it
        # and the PR auto-merges.
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail
          mapfile -t levels < <(python -c "import json; [print(x) for x in json.load(open('update/gemini-thinking.json')).get('unexpected_levels', [])]")
          if [ "${#levels[@]}" -eq 0 ]; then
            echo "No new thinking levels flagged."
            exit 0
          fi
          gh label create gemini-new-level --color D93F0B \
            --description "Gemini docs introduced a thinking tier needing a THINKING mapping" 2>/dev/null || true
          existing="$(gh issue list --state open --search 'Gemini docs introduced thinking level in:title' --json title -q '.[].title' || true)"
          for level in "${levels[@]}"; do
            [ -z "$level" ] && continue
            if printf '%s\n' "$existing" | grep -Fq "$level"; then
              echo "Tracking issue already open for level: ${level}"
              continue
            fi
            gh issue create \
              --title "feat(selector): Gemini docs introduced thinking level \"${level}\"" \
              --label gemini-new-level \
              --body "$(printf 'The Gemini API thinking docs introduced a thinking LEVEL **%s** beyond the known baseline (minimal/low/medium/high), recorded in `update/gemini-thinking.json` under `unexpected_levels`.\n\nThe refresh cron has flowed it into `thinking_levels`, so the conformance gate (check E) now requires the selector to enumerate and map it. **Action:** confirm the THINKING-field mapping the cron chose for **%s** (a new top-of-scale tier defaults to `XHigh`).\n\nOpened automatically by the Gemini refresh cron (`.github/workflows/update-gemini.yml`).' "${level}" "${level}")"
            echo "Opened tracking issue for level: ${level}"
          done

      - name: Reconcile Gemini thinking surface (Opus)
        # Skip on scheduled runs when the extracted facts did not change.
        # workflow_dispatch always runs. --dry-run previews without writing.
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        id: opus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          ARGS="--docs-changed"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python update/update_gemini.py $ARGS

      - name: Render model-selector.md
        # Keep the rendered mirror in sync with the .txt Opus just edited (the
        # test_doc_schema sync test gates this on the PR).
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        run: python update/render_md.py

      - name: Conformance gate (thinking vocabulary vs docs)
        # Deterministic backstop: the (Opus-edited) selector must conform to the
        # (freshly-extracted) docs snapshot — Gemini check E plus the Claude Code
        # and Codex checks. Fatal on violation, so a bad Opus prose edit blocks
        # the PR. Runs in dry-run too (the snapshot is refreshed even there).
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true'
        run: python update/validate_effort_conformance.py

      - name: Open PR if selector or snapshot changed
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.changed == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/model-selector.txt docs/model-selector.md update/gemini-thinking.json; then
            echo "No selector / snapshot changes — nothing to commit."
            exit 0
          fi
          git config user.name "roadmodel-bot"
          git config user.email "roadmodel-bot@users.noreply.github.com"
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/gemini-refresh-${DATE}"
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          summary="$(cat update/.last-gemini-summary.txt 2>/dev/null || echo 'Automated Gemini thinking refresh.')"
          warnings=""
          if [ -f update/.last-gemini-warnings.txt ] && [ -s update/.last-gemini-warnings.txt ]; then
            warnings="$(printf '\n\n## Warnings\n')$(sed 's/^/- /' update/.last-gemini-warnings.txt)"
          fi
          # FLAG (never act on) a new Gemini 3.x level model the docs introduced.
          unexpected="$(python -c "import json; print(', '.join(json.load(open('update/gemini-thinking.json')).get('unexpected_models', [])))" 2>/dev/null || true)"
          newmodel=""
          if [ -n "$unexpected" ]; then
            newmodel="$(printf '\n\n## New model(s) detected — route to the catalog cron\n\nThe Gemini thinking docs introduced: %s. This tracker only FLAGS new models; do NOT add them to selector model lists here. A tracking issue was opened.' "$unexpected")"
          fi
          # NOTE a new thinking LEVEL the docs introduced (the selector was updated
          # to enumerate/map it; the conformance gate enforced it).
          unexlevels="$(python -c "import json; print(', '.join(json.load(open('update/gemini-thinking.json')).get('unexpected_levels', [])))" 2>/dev/null || true)"
          newlevel=""
          if [ -n "$unexlevels" ]; then
            newlevel="$(printf '\n\n## New thinking level(s) detected\n\nThe Gemini thinking docs introduced reasoning tier(s): %s. The selector was reconciled to enumerate and map them (new top-of-scale tier -> XHigh); the conformance gate enforced it. A tracking issue was opened for review.' "$unexlevels")"
          fi
          git add docs/model-selector.txt docs/model-selector.md update/gemini-thinking.json
          git commit -m "Automated Gemini refresh: ${DATE}" -m "${summary}${warnings}${newmodel}${newlevel}"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated Gemini refresh: ${DATE}" \
            --body "$(printf '## Summary\n\n%s%s%s\n\n---\n\nThis PR was opened automatically by the daily Gemini refresh cron in `.github/workflows/update-gemini.yml`. It tracks the Gemini API thinking docs (HTML, parsed with bs4); the change trigger hashes the EXTRACTED FACTS, and the docs snapshot (`update/gemini-thinking.json`) plus the offline conformance gate (check E) keep the selector consistent with the docs. Auto-merge is enabled: GitHub will squash-merge once the `test` status check passes. To stop it: `gh pr merge --disable-auto`.' "$summary" "$warnings$newmodel" "$newlevel")")"
          echo "Opened: $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL"

      - name: Promote source-hash for next run
        # Only promote staged → canonical if every prior step succeeded and this
        # is not a dry run. A transient failure must NOT swallow a real change:
        # leave the old hash in place so tomorrow's gate retries.
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          if [ -f "update/.cache/gemini-docs-hash.new" ]; then
            mv "update/.cache/gemini-docs-hash.new" "update/.cache/gemini-docs-hash"
            echo "Promoted gemini-docs-hash for next-run comparison."
          fi
