name: probe-availability

# Phase 4.9 B4 — daily Anthropic availability probe. Invokes each Anthropic
# catalog model with a 1-token request; a model the API reports not-found is added
# to infra/model-availability.json, a benched model that becomes callable again is
# removed (self-heal). When the JSON changes it opens an auto-PR (glance, then it
# auto-merges); merging triggers sync-availability.yml, which writes the table the
# recommender reads — so a benched model is excluded WITHOUT a roadmodel release.
#
# Reads public-ish provider state only: the existing ANTHROPIC_API_KEY cron secret
# (already used by the catalog cron). No new secrets.

on:
  schedule:
    - cron: "0 21 * * *" # daily 21:00 UTC (staggered after the DeepSeek cron @20:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probe + print the plan; do not write the JSON or open a PR."
        type: boolean
        default: false

concurrency:
  group: probe-availability
  cancel-in-progress: false

permissions: {}

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; zizmor: ignore[artipacked] credentials needed for scoped PR push
        with:
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the AI-verification SDK
        # Only needed for the grounded un-bench sweep (verify_availability.py). The
        # cheap probe itself is stdlib; anthropic is imported lazily when a benched
        # entry is re-verified, so a missing/old SDK degrades to the cheap self-heal.
        run: pip install --require-hashes -r .github/requirements-updater.txt

      - name: Probe model availability (Anthropic / Google / OpenAI)
        # Each provider is gated on its key; a secret that is unset (e.g. OpenAI
        # until a key is added) simply skips that provider, never errors. The same
        # ANTHROPIC_API_KEY also powers the AI web-search verification that gates
        # un-benching (grounded restricted sweep).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python update/probe_availability.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Open auto-PR if availability changed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- infra/model-availability.json; then
            echo "No availability change — nothing to open."
            exit 0
          fi
          # Mirror the change into the bundled static <availability-context>
          # fallback so the offline CLI + planning kit (which never read the
          # runtime table) carry the correct state into the next release.
          python update/sync_static_availability.py
          python update/build_catalog.py
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="auto/availability-${DATE}-${{ github.run_id }}"
          # Validate final generated data before publishing or promoting source hashes.
          python update/automation_integrity.py
          git config user.name "roadmodel-bot"
          git config user.email "roadmodel-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add infra/model-availability.json docs/model-selector.txt docs/model-selector.md docs/catalog.json
          git commit -m "chore(availability): probe-detected availability change (${DATE})"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create \
            --title "chore(availability): probe-detected model availability change (${DATE})" \
            --body "$(printf '## Summary\n\nThe daily Anthropic availability probe detected a change and updated `infra/model-availability.json`. On merge, `sync-availability.yml` writes it to the `model_availability` table the recommender reads.\n\n**The validated refresh merger checks the final content and all CI results.** In the diff, an ADD benches a model (the probe got model-not-found); a REMOVE re-enables one (the probe succeeded). A change only happens on an explicit not-found / success — transient, auth, and rate-limit errors classify as ambiguous and never edit the file.\n\nProbe: `update/probe_availability.py` (1-token invocation per Anthropic catalog model). Opened automatically by `.github/workflows/probe-availability.yml`. To stop: mark the PR as draft.')")"
          echo "The validated refresh merger will evaluate $PR_URL."
