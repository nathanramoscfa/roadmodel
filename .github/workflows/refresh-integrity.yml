name: Refresh instruction integrity

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] trusted base code; blob-only review
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  evaluate-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Base code only. Never check out PR head or consume candidate artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate candidate blobs using the base policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/cron_pr.py --repo "$GH_REPO" --review "$PR_NUMBER" --post-status
