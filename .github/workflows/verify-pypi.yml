# .github/workflows/verify-pypi.yml
name: Verify PyPI install

on:
  workflow_dispatch:
    inputs:
      version:
        description: "roadmodel version to verify from PyPI (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install roadmodel from PyPI in a clean venv
        run: |
          python -m venv .venv-verify
          . .venv-verify/bin/activate
          python -m pip install --upgrade pip
          pip install "roadmodel==${{ inputs.version }}"
      - name: Smoke test
        run: |
          . .venv-verify/bin/activate
          which roadmodel
          roadmodel --help
          python -c "import roadmodel; print('module __version__ =', roadmodel.__version__)"
          python -c "import platform; print(platform.platform()); print('python', platform.python_version())"
