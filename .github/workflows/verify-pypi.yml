# .github/workflows/verify-pypi.yml
name: Verify PyPI install

on:
  workflow_dispatch:
    inputs:
      version:
        description: "roadmodel version to verify. Accepts a bare PEP 440 version (0.1.0), a leading-v tag (v0.1.0), or a release tag with `-pypi` suffix (v0.1.0-pypi)."
        required: true
        type: string
      source:
        description: "Package index: pypi (production) or testpypi"
        required: false
        default: pypi
        type: choice
        options:
          - pypi
          - testpypi
  workflow_call:
    inputs:
      version:
        description: "roadmodel version. Accepts 0.1.0, v0.1.0, or v0.1.0-pypi."
        required: true
        type: string
      source:
        description: "pypi or testpypi"
        required: false
        default: pypi
        type: string

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux only — free on public repos. macOS install-smoke runs locally
        # on the Mac Studio via scripts/verify-macos.sh --pypi <version>.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install roadmodel
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%-pypi}"
          SOURCE="${{ inputs.source }}"
          python -m venv .venv-verify
          # shellcheck disable=SC1091
          . .venv-verify/bin/activate
          python -m pip install --upgrade pip
          if [ "${SOURCE}" = "testpypi" ]; then
            # TestPyPI's /simple/ page sits behind a CDN that caches
            # it for up to 600s per edge (Cache-Control: max-age=600),
            # so a job that starts right after the upload can see the
            # previous version for ~10 minutes — the JSON API is
            # current at once, but pip reads /simple/. 3 tries 10s
            # apart failed a leg on both 2026-09-23 releases. Retry
            # for up to ~12 minutes, inside the job's 15-minute limit.
            # --extra-index-url so runtime deps (anthropic, openai, ...)
            # resolve from production PyPI; TestPyPI only carries
            # roadmodel itself.
            attempts=25
            for attempt in $(seq 1 $attempts); do
              if pip install --no-cache-dir \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                "roadmodel==${VERSION}"; then
                exit 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "TestPyPI install attempt ${attempt}/${attempts} failed; retry in 30s..."
                sleep 30
              fi
            done
            echo "TestPyPI install failed after ${attempts} attempts" >&2
            exit 1
          else
            pip install "roadmodel==${VERSION}"
          fi
      - name: Smoke test
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . .venv-verify/bin/activate
          which roadmodel
          roadmodel --help
          python -c "import roadmodel; print('module __version__ =', roadmodel.__version__)"
          python -c "import platform; print(platform.platform()); print('python', platform.python_version())"
